name: Publish site

on:
  pull_request:
    paths: ['site/**', 'scripts/build-site.mjs', 'scripts/audit-site.mjs', 'tests/site.test.mjs', 'examples/skills-lab/**', 'docs/skills/**', 'docs/guides/**', 'docs/fieldnotes/**', 'docs/examples/**', 'skills/**', 'fonts/**', 'fixtures/instance/analytics/findings/**/render/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-site.mjs', 'scripts/audit-site.mjs', 'tests/site.test.mjs', 'examples/skills-lab/**', 'docs/skills/**', 'docs/guides/**', 'docs/fieldnotes/**', 'docs/examples/**', 'skills/**', 'fonts/**', 'fixtures/instance/analytics/findings/**/render/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test tests/site.test.mjs
      - run: pnpm check:skills-lab
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
