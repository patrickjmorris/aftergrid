name: ci
on: [push, pull_request]
jobs:
  seam-1:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.18", 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: expose a local Postgres runtime when the image has one (seam-2 Postgres contract)
        shell: bash
        run: |
          for d in /usr/lib/postgresql/*/bin /opt/homebrew/opt/postgresql@*/bin /usr/local/opt/postgresql@*/bin; do
            if [ -x "$d/initdb" ] && [ -x "$d/pg_ctl" ]; then echo "$d" >> "$GITHUB_PATH"; echo "postgres runtime: $d"; break; fi
          done
          exit 0
      - run: pnpm run validate:fixtures
      - run: node --test 'src/**/*.test.ts'
      - run: node src/cli.ts --help
      - run: node src/cli.ts check fixtures/instance/analytics/findings/2026-07-20-onboarding-checklist-retention --json
      - run: node src/cli.ts check fixtures/instance/analytics/findings/2026-09-15-price-change-cancellations --mode rerun --json
      - run: cp -R fixtures/instance /tmp/inst && node src/cli.ts render /tmp/inst/analytics/findings/2026-07-20-onboarding-checklist-retention --png --json
      - run: node src/cli.ts check fixtures/negatives/control-valid --json
      - run: node src/cli.ts check fixtures/negatives/unresolved-reference --json || test $? -eq 1
      - run: node src/cli.ts hook status --settings /tmp/ag-settings.json --json
      - run: node src/cli.ts check fixtures/runs/kpc-numeric/output --mode rerun --json
      - run: node src/cli.ts check fixtures/runs/kpc-insufficient/output --mode rerun --json
      # An eval is evaluation material and never a merge gate (docs/contracts/eval.md): exit 1 means a golden
      # case failed, and that must not fail the PR check. 2 (usage/refusal) and 3 still do.
      - run: node src/cli.ts eval --golden all --analyzer fixture --json || test $? -eq 1
      - name: setup scaffolds a fresh Instance end to end (skills bundle faked; CI runners have no Claude Code plugins)
        shell: bash
        run: |
          mkdir -p /tmp/ag-skills/grilling /tmp/ag-skills/writing-for-agents /tmp/ag-inst/data
          printf -- '---\nname: stub\n---\n' | tee /tmp/ag-skills/grilling/SKILL.md /tmp/ag-skills/writing-for-agents/SKILL.md >/dev/null
          cp fixtures/instance/data/*.csv /tmp/ag-inst/data/
          AFTERGRID_SKILLS_PATH=/tmp/ag-skills node src/cli.ts setup --instance /tmp/ag-inst --adapter duckdb --duckdb-path data \
            --owner-name "CI Owner" --owner-contact ci@example.invalid \
            --repository example/instance --automation-login example-bot --trusted-approver a-human --skip-hook --json
          test -f /tmp/ag-inst/aftergrid.yaml && test -f /tmp/ag-inst/decisions.md
          ! ls /tmp/ag-inst/findings | grep -q setup-smoke   # the smoke ran in a temp copy, not in the Instance

  pack-smoke:
    # The packed product from a clean environment: pack, audit the tarball, install it with --ignore-scripts into
    # an empty project and drive the installed bin through setup/hook, new -> check -> draft render, decide and the
    # intake fixture workflow. This matrix IS the supported platform matrix in docs/contracts/distribution.md:
    # nothing outside it is claimed, and Windows is not tested.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.18", 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node src/cli.ts plugin validate --json
      - run: node scripts/pack-smoke.mjs
