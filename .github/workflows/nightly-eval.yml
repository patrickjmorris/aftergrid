# Nightly golden eval (bead ag-nightly-eval-0dv, spec stories 43–44). Contract: docs/contracts/eval.md.
#
# This workflow is NOT `on: pull_request` and is NOT a required check. Nightly results are evaluation material:
# a regression here opens an issue, it never blocks a merge.
#
# The model-in-the-loop half runs only when ANTHROPIC_API_KEY is present. Without the secret the job runs the
# fixture analyzer and says, in the job summary, that the model path was NOT exercised — it never reports a
# green model run it did not make.
name: nightly-eval

on:
  schedule:
    # 04:17 UTC, nightly. An odd minute so the run does not land in the hour's queue spike.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact revision to evaluate (release candidate). Defaults to the default branch."
        required: false
        type: string
      model:
        description: "Model id to record with the run. Recorded as-is; it is not a switch."
        required: false
        type: string
      budget_minutes:
        description: "Wall-clock budget for the whole run."
        required: false
        default: "30"
        type: string
      max_cost_usd:
        description: "Spend ceiling handed to each analyzer invocation, in US dollars."
        required: false
        default: "2"
        type: string
      report_issues:
        description: "Open or comment on one issue per failure fingerprint. The scheduled run always files."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  # Reading the previous nightly's artifact, for the comparison. Nothing here writes to a data source.
  actions: read

concurrency:
  group: nightly-eval-${{ inputs.sha || github.ref }}
  cancel-in-progress: false

jobs:
  golden:
    runs-on: ubuntu-latest
    # Twice the default budget, so the job outlives the run it bounds rather than truncating it.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run evaluates the exact revision it was given, without waiting for the schedule.
          ref: ${{ inputs.sha || github.sha }}
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: decide which analyzer this run can honestly use, and install it
        id: analyzer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "kind=command" >> "$GITHUB_OUTPUT"
            # Nothing on a runner provides `claude`, and the command branch shells out to it. Latest, on
            # purpose: pinning a version here would quietly evaluate an old orchestrator against today's skills.
            npm i -g @anthropic-ai/claude-code
            claude --version
          else
            echo "kind=fixture" >> "$GITHUB_OUTPUT"
          fi

      - name: run the golden suite, bounded
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET_MINUTES: ${{ inputs.budget_minutes || '30' }}
          MAX_COST_USD: ${{ inputs.max_cost_usd || '2' }}
          MODEL: ${{ inputs.model }}
          SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set +e
          # budget_minutes is a free-text workflow_dispatch input. Validate it before it reaches arithmetic:
          # an empty or non-numeric value would otherwise become a zero budget and skip every case.
          case "$BUDGET_MINUTES" in
            ''|*[!0-9]*) echo "budget_minutes must be an integer number of minutes, got '$BUDGET_MINUTES'" >&2; exit 2;;
          esac
          BUDGET_MS=$(( BUDGET_MINUTES * 60000 ))
          CASE_MS=$(( BUDGET_MS / 3 ))
          ARGS=(--golden all --sha "$SHA" --out eval-runs --budget-ms "$BUDGET_MS" --case-timeout-ms "$CASE_MS" --max-cost-usd "$MAX_COST_USD" --json)
          [ -n "$MODEL" ] && ARGS+=(--model "$MODEL")
          if [ "${{ steps.analyzer.outputs.kind }}" = "command" ]; then
            # Headless Claude Code running /analyze over the Finding the runner just created.
            #
            # /analyze is a skill of THIS repository's plugin, and the Finding lives in a mkdtemp copy of the
            # Instance, so the plugin has to be loaded explicitly: --plugin-dir {repo_root} is substituted with
            # the Engine checkout. --max-budget-usd {max_cost_usd} is the spend ceiling, enforced by the CLI
            # itself; the runner substitutes what --max-cost-usd configured and records what the run reported
            # spending. The template is substituted per argument (there is no shell, so a quoted token would
            # keep its quotes) and is recorded in run.json with its secrets redacted. The Finding directory
            # carries the raw ask, the reader and the Question, so the skill needs the directory rather than
            # the prose; AFTERGRID_FINDING_DIR and AFTERGRID_INSTANCE are in the child's environment as well.
            ARGS+=(--analyzer command --analyzer-command "claude -p /analyze --plugin-dir {repo_root} --add-dir {finding_dir} --permission-mode acceptEdits --max-budget-usd {max_cost_usd} --output-format json")
          else
            ARGS+=(--analyzer fixture)
          fi
          node src/cli.ts eval nightly "${ARGS[@]}" > nightly.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      # A baseline is what makes a failure news: "this passed last night and fails now". When there is no
      # previous artifact to compare against, the job says so instead of implying a trend.
      - name: fetch the previous nightly as a baseline
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The baseline has to be comparable: the same branch (a feature branch's nightly is not this one's
          # yesterday) and a run that actually finished (a cancelled run recorded nothing to compare against).
          prev=$(gh run list --workflow nightly-eval.yml --branch "${{ github.event.repository.default_branch }}" \
                   --status completed --limit 10 \
                   --json databaseId,headSha,conclusion \
                   --jq "[.[] | select(.headSha != \"${{ steps.rev.outputs.sha }}\") | select(.conclusion != \"cancelled\")][0].databaseId" || true)
          if [ -n "$prev" ] && [ "$prev" != "null" ]; then
            gh run download "$prev" --dir baseline-download || true
            found=$(find baseline-download -maxdepth 3 -name run.json -print -quit 2>/dev/null || true)
            [ -n "$found" ] && mv "$(dirname "$found")" baseline-run
          fi
          if [ -d baseline-run ]; then
            echo "Baseline: run id \`$prev\` on \`${{ github.event.repository.default_branch }}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous nightly artifact was available, so no comparison is claimed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: compare against the previous nightly
        if: always()
        continue-on-error: true
        run: |
          if [ -d baseline-run ]; then
            node src/cli.ts eval compare baseline-run "eval-runs/${{ steps.rev.outputs.sha }}" --json > comparison-report.json || true
          fi

      - name: job summary
        if: always()
        run: |
          # Whether a model was really in the loop is decided from the recorded run, never from the secret
          # being set: the secret is present long before an analyzer crashes, and a job that read it as
          # evidence would claim a model run nobody made. `eval summary` applies the rule in one place.
          {
            node src/cli.ts eval summary "eval-runs/${{ steps.rev.outputs.sha }}" \
              || echo "## Model in the loop: NOT exercised"$'\n\n'"No run.json was written: the run did not get far enough to record what it did."
            echo ""
            echo "Exit code: \`${{ steps.run.outputs.exit_code }}\` (0 clean, 1 a case failed or errored, 2 usage, 4 partial run)."
            echo ""
            cat "eval-runs/${{ steps.rev.outputs.sha }}/summary.md" 2>/dev/null || echo "no summary.md was written: the run did not get that far."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: retain the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-${{ steps.rev.outputs.sha }}
          path: eval-runs/${{ steps.rev.outputs.sha }}/
          retention-days: 30
          if-no-files-found: warn

      # Opt-in. One issue per failure fingerprint; a repeat comments on the issue that already exists. This step
      # re-runs nothing: it reads the run.json the step above wrote.
      - name: file or update one issue per failure
        # `inputs` is null on a schedule, so gating on inputs.report_issues alone would mean the scheduled
        # nightly — the one that actually runs every night — never filed anything it found.
        if: ${{ always() && (github.event_name == 'schedule' || inputs.report_issues) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node src/cli.ts eval report "eval-runs/${{ steps.rev.outputs.sha }}" \
            --repo "${{ github.repository }}" \
            --artifact-base "eval-runs/${{ steps.rev.outputs.sha }}" --json | tee issues.json
        continue-on-error: true

      - name: fail the job only on a failing case, never on a merge gate
        if: always()
        run: |
          # This job is not a required check; the exit code is here so the nightly is visibly red when a case
          # failed (1) or when a bound left the suite partly unrun (4).
          exit ${{ steps.run.outputs.exit_code }}
