<title>Aftergrid Landing Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* ============================================================
   Tokens · Aftergrid Soft Frame
   ============================================================ */
:root {
  --navy: #142440;
  --ice: #E9F0FA;
  --ink: #142440;
  --ink-2: #47536B;
  --ink-3: #7A8598;
  --blue-2: #1E3660;
  --blue-3: #4A6AA6;
  --blue-4: #8AA5D6;
  --tint: #DCE6F5;
  --ground: #E9F0FA;
  --paper: #FFFFFF;
  --paper-2: #F5F8FC;
  --line: #C9D5E8;
  --line-2: #E0E8F3;
  --bar-grey: #B9C5D8;
  --pass: #1F7A5A; --pass-bg: #E1F2EA;
  --warn: #8A5A00; --warn-bg: #FFF1D6;
  --fail: #A63A2B; --fail-bg: #FBE5E0;
  --focus: #1D4ED8;
  --chrome-bg: #0F1B30; --chrome-fg: #E9F0FA; --chrome-line: #24365A;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --doc-face: var(--sans);
  --shadow-card: 0 1px 1px rgba(20,36,64,.04), 0 2px 6px rgba(20,36,64,.05), 0 24px 48px -24px rgba(20,36,64,.35);
  --shadow-float: 0 1px 2px rgba(20,36,64,.06), 0 10px 24px -12px rgba(20,36,64,.28);
  --btn-bg: #142440; --btn-fg: #E9F0FA;
  --mark-bg: #142440; --mark-fg: #E9F0FA;
  --pin-bg: #142440; --pin-fg: #E9F0FA;
  --dot: #142440;
  --term-bg: #142440; --pub-bg: #142440; --tip-bg: #142440;
  --glow: rgba(255,255,255,.85);
  --wire-solid: #142440;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #E9F0FA; --ink-2: #B7C2D6; --ink-3: #8C99B0; --blue-2: #C9D8F2; --blue-3: #9FB7E3; --blue-4: #5F7AA8; --tint: #1E3152;
    --ground: #0C1729; --paper: #142440; --paper-2: #1A2D50; --line: #2C4068; --line-2: #24375C; --bar-grey: #4A5D7E;
    --pass: #78D3AC; --pass-bg: #163A2E; --warn: #F3C36B; --warn-bg: #3B2C0C; --fail: #F1A090; --fail-bg: #3F1E18; --focus: #8AB4FF;
    --chrome-bg: #080F1C; --chrome-line: #1B2A47;
    --shadow-card: 0 1px 1px rgba(0,0,0,.2), 0 24px 48px -24px rgba(0,0,0,.6);
    --shadow-float: 0 10px 24px -12px rgba(0,0,0,.5);
    --btn-bg: #E9F0FA; --btn-fg: #142440;
    --mark-bg: #E9F0FA; --mark-fg: #142440;
    --pin-bg: #E9F0FA; --pin-fg: #142440;
    --dot: #9FB7E3;
    --term-bg: #0C1729; --pub-bg: #0C1729; --tip-bg: #0C1729;
    --glow: rgba(74,106,166,.25);
    --wire-solid: #E9F0FA;
  }
}
:root[data-theme="dark"] {
  --ink: #E9F0FA; --ink-2: #B7C2D6; --ink-3: #8C99B0; --blue-2: #C9D8F2; --blue-3: #9FB7E3; --blue-4: #5F7AA8; --tint: #1E3152;
  --ground: #0C1729; --paper: #142440; --paper-2: #1A2D50; --line: #2C4068; --line-2: #24375C; --bar-grey: #4A5D7E;
  --pass: #78D3AC; --pass-bg: #163A2E; --warn: #F3C36B; --warn-bg: #3B2C0C; --fail: #F1A090; --fail-bg: #3F1E18; --focus: #8AB4FF;
  --chrome-bg: #080F1C; --chrome-line: #1B2A47;
  --shadow-card: 0 1px 1px rgba(0,0,0,.2), 0 24px 48px -24px rgba(0,0,0,.6);
  --shadow-float: 0 10px 24px -12px rgba(0,0,0,.5);
  --btn-bg: #E9F0FA; --btn-fg: #142440;
  --mark-bg: #E9F0FA; --mark-fg: #142440;
  --pin-bg: #E9F0FA; --pin-fg: #142440;
  --dot: #9FB7E3;
  --term-bg: #0C1729; --pub-bg: #0C1729; --tip-bg: #0C1729;
  --glow: rgba(74,106,166,.25);
  --wire-solid: #E9F0FA;
}

* { box-sizing: border-box; }
html { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
code, pre, .mono { font-family: var(--mono); }
.sr { position: absolute; left: -999px; width: 1px; height: 1px; overflow: hidden; }
.num { font-variant-numeric: tabular-nums; }

/* ============================================================
   Explorer chrome (not part of the landing page)
   ============================================================ */
.chrome { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--chrome-bg); color: var(--chrome-fg); border-bottom: 1px solid var(--chrome-line); font-size: 13px; }
.chrome-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
.chrome-brand { font-weight: 800; letter-spacing: -0.02em; font-size: 14px; margin-right: 4px; }
.chrome-brand span { font-weight: 400; opacity: .6; margin-left: 6px; }
.seg { display: inline-flex; border: 1px solid var(--chrome-line); border-radius: 999px; padding: 2px; gap: 2px; background: rgba(255,255,255,.03); }
.seg button { background: transparent; border: 0; color: inherit; padding: 4px 11px; border-radius: 999px; cursor: pointer; opacity: .7; white-space: nowrap; }
.seg button:hover { opacity: 1; }
.seg button[aria-pressed="true"] { background: var(--ice); color: var(--navy); opacity: 1; font-weight: 600; }
.chrome-spacer { flex: 1; }
.chrome-btn { background: transparent; border: 1px solid var(--chrome-line); color: inherit; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chrome-btn:hover { background: rgba(255,255,255,.06); }

.stage-wrap { padding-block: 20px 80px; padding-inline: 16px; }
.stage { container-type: inline-size; container-name: page; min-width: 0; margin: 0 auto; max-width: 1360px; background: var(--ground); box-shadow: 0 0 0 1px var(--line); border-radius: 12px; overflow: hidden; transition: max-width .25s ease; }
.stage-wrap[data-width="phone"] .stage { max-width: 392px; }
.stage-wrap[data-width="tablet"] .stage { max-width: 820px; }
@media (prefers-reduced-motion: reduce) { .stage { transition: none; } }

.sec { position: relative; }
.sec-ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; padding: 6px 12px; font-size: 11px; font-family: var(--mono); background: color-mix(in srgb, var(--navy) 6%, transparent); border-top: 1px solid color-mix(in srgb, var(--navy) 14%, transparent); }
.sec-ctl .lbl { color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; font-size: 10px; margin-left: 8px; }
.sec-ctl .vs { display: inline-flex; gap: 2px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.sec-ctl .vs button { border: 0; background: transparent; padding: 2px 9px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-family: var(--sans); font-size: 11px; }
.sec-ctl .vs button[aria-pressed="true"] { background: var(--navy); color: var(--ice); }
.stage-wrap[data-controls="off"] .sec-ctl { display: none; }

/* ============================================================
   Landing page system
   ============================================================ */
.page { background: var(--ground); color: var(--ink); overflow-x: clip; }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 32px; }
.section { padding-block: 112px; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 22px; }
.eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--dot); }
.h2 { font-size: clamp(30px, 3.9cqw, 50px); font-weight: 700; letter-spacing: -0.032em; line-height: 1.04; max-width: 19ch; }
.lead { font-size: 19px; line-height: 1.5; color: var(--ink-2); max-width: 46ch; }
.lead.small { font-size: 16.5px; }
.prose { max-width: 56ch; color: var(--ink-2); font-size: 17px; line-height: 1.55; }
.prose p + p { margin-top: 14px; }
.head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: end; margin-bottom: 56px; }
.head .lead { justify-self: end; }
.display { font-weight: 800; letter-spacing: -0.045em; line-height: .96; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 9px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid transparent; cursor: pointer; line-height: 1; white-space: nowrap; }
.btn-primary { background: var(--btn-bg); color: var(--btn-fg); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 1px 2px rgba(20,36,64,.2); }
.btn-primary:hover { background: var(--blue-2); }
.btn-ghost { background: var(--paper); color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--blue-4); }
.chip { display: inline-flex; align-items: center; gap: 10px; height: 46px; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 0 16px; font-family: var(--mono); font-size: 13.5px; color: var(--ink); }
.chip .dollar { color: var(--ink-3); }
.tag { display: inline-block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 40px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 32px; }
.fine { font-size: 13px; color: var(--ink-3); }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.figcap { display: flex; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-top: 16px; line-height: 1.5; }
.figcap b { color: var(--ink-2); font-weight: 500; }
.figcap .n { color: var(--ink); flex: none; }
.mark { background: var(--mark-bg); color: var(--mark-fg); padding: 0 .14em; margin: 0 -.02em; border-radius: .1em; line-height: 1.05; display: inline-block; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.hr { height: 1px; background: var(--line-2); }
@container page (max-width: 820px) { .grid2, .grid3, .head { grid-template-columns: minmax(0,1fr); } .section { padding-block: 64px; } .wrap { padding-inline: 20px; } .head { gap: 20px; margin-bottom: 36px; } .head .lead { justify-self: start; } }

/* surface: blueprint */
.page[data-surface="grid"] { --gridc: color-mix(in srgb, var(--ink) 6%, transparent); background-image: linear-gradient(var(--gridc) 1px, transparent 1px), linear-gradient(90deg, var(--gridc) 1px, transparent 1px); background-size: 40px 40px; }
.page[data-surface="grid"] .section { position: relative; }
.page[data-surface="grid"] .section::before, .page[data-surface="grid"] .section::after { content: "+"; position: absolute; top: -9px; font: 500 15px/1 var(--mono); color: var(--blue-4); }
.page[data-surface="grid"] .section::before { left: 12px; } .page[data-surface="grid"] .section::after { right: 12px; }

/* wordmark */
.wordmark { font-weight: 800; letter-spacing: -0.04em; font-size: 24px; line-height: 1; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
.wordmark .sym { width: 24px; height: 24px; display: inline-block; }
.wordmark .sym path { fill: var(--ink); }

/* nav */
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 72px; }
.nav-links { display: flex; align-items: center; gap: 24px; font-size: 14.5px; font-weight: 500; }
.nav-links a { text-decoration: none; color: var(--ink-2); }
.nav-links a:hover { color: var(--ink); }
.nav-links .btn { height: 38px; padding: 0 14px; font-size: 13.5px; }
.nav-links .chip { height: 38px; font-size: 12.5px; }
@container page (max-width: 620px) { .nav-links .hide-sm { display: none; } .nav-links { gap: 16px; } }

/* ============================================================
   Frame (browser window) and the Finding document
   ============================================================ */
.frame { contain: inline-size; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-card); }
.frame .bar { border-radius: 13px 13px 0 0; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line-2); background: var(--paper-2); }
.frame .bar .dots { display: flex; gap: 6px; }
.frame .bar .dots i { width: 10px; height: 10px; border-radius: 999px; background: var(--line); display: block; }
.frame .bar .url { flex: 1 1 0; width: 0; font-family: var(--mono); font-size: 11px; color: var(--ink-3); background: var(--paper); border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.frame .body { padding: 30px 34px 28px; border-radius: 0 0 13px 13px; }
.frame.compact .body { padding: 22px 24px; }

.doc { contain: inline-size; font-family: var(--doc-face); color: var(--ink); font-size: 14.5px; line-height: 1.5; }
.doc.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 30px 34px; box-shadow: var(--shadow-card); }
.doc .draft { display: inline-block; font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--warn); background: var(--warn-bg); border-radius: 5px; padding: 4px 8px; margin-bottom: 16px; }
.doc h1 { font-size: 21px; font-weight: 700; line-height: 1.22; letter-spacing: -0.02em; margin-bottom: 8px; }
.doc .meta { font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); margin-bottom: 20px; }
.doc h2 { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 22px 0 8px; padding-top: 14px; border-top: 1px solid var(--line-2); }
.doc h2.first { border-top: 0; padding-top: 0; margin-top: 0; }
.doc .answer { font-size: 17.5px; font-weight: 600; line-height: 1.4; letter-spacing: -0.01em; }
.doc .caveat { border-left: 3px solid var(--ink); padding: 8px 14px; margin-top: 12px; background: var(--paper-2); font-size: 13.5px; }
.doc .caveat b { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
.doc h3 { font-size: 15.5px; font-weight: 600; line-height: 1.35; margin: 10px 0 10px; letter-spacing: -0.01em; }
.doc .type { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.doc svg { width: 100%; height: auto; display: block; margin: 8px 0 4px; font-family: var(--sans); }
.doc table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; font-family: var(--sans); }
.doc th, .doc td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.doc th { font-weight: 600; color: var(--ink-2); font-size: 12px; }
.doc td.num, .doc th.num { text-align: right; font-variant-numeric: tabular-nums; }
.doc dl { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 6px 14px; font-size: 13.5px; margin: 12px 0; }
.doc dt { color: var(--ink-3); font-family: var(--sans); } .doc dd { margin: 0; }
.doc details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-top: 8px; font-size: 13.5px; }
.doc summary { cursor: pointer; font-weight: 600; font-family: var(--sans); font-size: 13.5px; }
.doc .facts { list-style: none; padding: 0; margin: 0; font-family: var(--sans); font-size: 13.5px; }
.doc .facts li { display: grid; grid-template-columns: 20px 150px minmax(0,1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-2); align-items: start; }
.doc .facts li:last-child { border-bottom: 0; }
.doc .facts b { color: var(--ink-2); font-weight: 600; }
.mk { width: 18px; height: 18px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; margin-top: 1px; flex: none; }
.mk.ok { background: var(--pass-bg); color: var(--pass); }
.mk.no { background: var(--fail-bg); color: var(--fail); }
.mk.na { background: var(--paper-2); color: var(--ink-3); border: 1px solid var(--line); }
.mk.wn { background: var(--warn-bg); color: var(--warn); }
.doc .action { display: inline-block; font-family: var(--sans); background: var(--btn-bg); color: var(--btn-fg); padding: 9px 14px; border-radius: 7px; font-size: 13.5px; font-weight: 600; text-decoration: none; margin-top: 8px; }
.doc .foot { font-family: var(--sans); color: var(--ink-3); font-size: 12.5px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line-2); }
@container page (max-width: 560px) { .doc dl { grid-template-columns: minmax(0,1fr); } .doc .facts li { grid-template-columns: 20px 1fr; } .doc .facts b { grid-column: 2; } .doc .facts span:last-child { grid-column: 2; } .frame .body { padding: 20px 18px; } .doc.card { padding: 22px 18px; } }

/* traced number + provenance popover */
.ref { position: relative; text-decoration: underline; text-decoration-style: dotted; text-decoration-color: var(--blue-4); text-underline-offset: 4px; text-decoration-thickness: 1.5px; cursor: help; font-variant-numeric: tabular-nums; border-radius: 3px; }
.ref:hover, .ref:focus-within, .ref.open { text-decoration-color: var(--navy); background: var(--tint); }
.ref .tip { display: none; position: absolute; left: 0; top: calc(100% + 10px); z-index: 40; width: 380px; max-width: 88cqw; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 28px 56px -18px rgba(20,36,64,.38), 0 2px 6px rgba(20,36,64,.08); font-family: var(--sans); font-size: 13px; line-height: 1.45; font-weight: 400; text-align: left; letter-spacing: 0; text-transform: none; cursor: default; }
.ref .tip::before { content: ""; position: absolute; left: 18px; top: -6px; width: 10px; height: 10px; background: var(--paper); border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg); }
.ref.up .tip { top: auto; bottom: calc(100% + 10px); }
.ref.up .tip::before { top: auto; bottom: -6px; transform: rotate(225deg); }
.ref:hover .tip, .ref:focus-within .tip, .ref.open .tip { display: block; }
.ref .tip .th { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line-2); }
.ref .tip .th b { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ref .tip .th span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right; }
.ref .tip ol { list-style: none; margin: 0; padding: 10px 14px 4px; display: grid; }
.ref .tip li { display: grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 10px; padding: 6px 0; align-items: start; position: relative; }
.ref .tip li::before { content: ""; position: absolute; left: 8.5px; top: 24px; bottom: -6px; border-left: 1px dashed var(--line); }
.ref .tip li:last-child::before { display: none; }
.ref .tip li i { width: 18px; height: 18px; border-radius: 999px; background: var(--tint); color: var(--navy); font: 600 9.5px/18px var(--mono); text-align: center; font-style: normal; margin-top: 1px; }
.ref .tip li b { display: block; font-weight: 600; font-size: 13px; }
.ref .tip li span { display: block; color: var(--ink-2); font-size: 12px; font-family: var(--mono); overflow-wrap: anywhere; }
.ref .tip li em { font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--pass); white-space: nowrap; padding-top: 3px; }
.ref .tip li em.wn { color: var(--warn); }
.ref .tip .sql { display: block; margin: 6px 14px 12px; background: var(--paper-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 12px; font-family: var(--mono); font-size: 11px; line-height: 1.55; color: var(--ink-2); white-space: pre-wrap; }
.ref .tip .ft { padding: 0 14px 12px; font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
.ref .tip .ft code { font-size: 10.5px; }

/* pins over a visual */
.pinned { position: relative; }
.pin { position: absolute; left: var(--x); top: var(--y); width: 24px; height: 24px; border-radius: 999px; background: var(--pin-bg); color: var(--pin-fg); font: 600 11.5px/1 var(--mono); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ground) 92%, transparent), 0 4px 10px -4px rgba(20,36,64,.5); z-index: 3; transform: translate(-50%, -50%); }
.pin-legend { list-style: none; margin: 22px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.pin-legend li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }
.pin-legend li b { width: 24px; height: 24px; border-radius: 999px; background: var(--pin-bg); color: var(--pin-fg); font: 600 11.5px/1 var(--mono); display: flex; align-items: center; justify-content: center; }
.pin-legend li strong { color: var(--ink); display: block; }
@container page (max-width: 720px) { .pin-legend { grid-template-columns: minmax(0,1fr); } }

/* paper stack + glow */
.stack { position: relative; isolation: isolate; }
.stack::before, .stack::after { content: ""; position: absolute; inset: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; z-index: -1; box-shadow: var(--shadow-float); }
.stack::before { transform: translate(12px, -12px) rotate(.6deg); opacity: .9; }
.stack::after { transform: translate(24px, -24px) rotate(1.2deg); opacity: .65; }
.glow { position: absolute; inset: -12% -8%; background: radial-gradient(60% 55% at 60% 40%, var(--glow), transparent 70%); pointer-events: none; z-index: 0; }
.visual { position: relative; }
.visual > * { position: relative; z-index: 1; }

/* ============================================================
   Terminal · phone · mini artifacts
   ============================================================ */
.term { contain: inline-size; background: var(--term-bg); color: #DCE6F5; border-radius: 14px; font-family: var(--mono); font-size: 13px; line-height: 1.65; overflow: hidden; box-shadow: var(--shadow-card); border: 1px solid #22355A; }
.term .tbar { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); font-size: 11.5px; color: #7B8CA8; }
.term .tbar .dots { display: flex; gap: 6px; } .term .tbar .dots i { width: 10px; height: 10px; border-radius: 999px; background: #2C3E60; display: block; }
.term pre { margin: 0; padding: 20px 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
.term .p { color: #8FB0E6; } .term .ok { color: #7ED9B2; } .term .warn { color: #F3C36B; } .term .dim { color: #7B8CA8; } .term .str { color: #C9D6EA; }

.phone { contain: inline-size; width: 300px; max-width: 100%; margin: 0 auto; background: #0F1B30; border-radius: 42px; padding: 12px; box-shadow: 0 30px 60px -28px rgba(20,36,64,.7), inset 0 0 0 2px #2C3E60; }
.phone .screen { background: var(--paper); border-radius: 32px; padding: 14px 18px 16px; height: 560px; overflow: hidden; position: relative; }
.phone .status { display: flex; justify-content: space-between; font: 600 12px var(--sans); color: var(--ink); padding: 4px 6px 16px; }
.phone .status .island { width: 90px; height: 24px; background: #0F1B30; border-radius: 999px; margin: -6px auto 0; }
.phone .screen::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 100px; background: linear-gradient(to bottom, transparent, var(--paper)); border-radius: 0 0 32px 32px; }
.phone .doc { font-size: 13px; }
.phone .doc h1 { font-size: 16.5px; }
.phone .doc .answer { font-size: 14.5px; }

/* ---- collage of artifacts ---- */
.collage { contain: inline-size; position: relative; aspect-ratio: 1200 / 700; max-width: 100%; }
.collage .wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.collage .wires path { fill: none; stroke: var(--blue-3); stroke-opacity: .75; stroke-width: 1.6; stroke-dasharray: 5 6; }
.collage .wires path.solid { stroke: var(--wire-solid); stroke-dasharray: none; stroke-width: 2; }
.collage .wires circle { fill: var(--blue-4); }
.collage .wires circle.solid { fill: var(--wire-solid); }
.collage .wires text { font: 500 11px var(--mono); fill: var(--ink-2); letter-spacing: .08em; }
.art { contain: inline-size; position: absolute; left: var(--x); top: var(--y); width: var(--w); min-width: 0; transform: rotate(var(--r, 0deg)); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-card); font-size: 12px; line-height: 1.45; color: var(--ink-2); overflow: hidden; }
.art .wb { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--line-2); background: var(--paper-2); font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; }
.art .wb .dots { display: flex; gap: 5px; flex: none; } .art .wb .dots i { width: 8px; height: 8px; border-radius: 999px; background: var(--line); display: block; }
.art .wb span { overflow: hidden; text-overflow: ellipsis; }
/* sql window */
.art.sqlwin .code { display: grid; grid-template-columns: 22px 1fr; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; padding: 10px 12px; color: var(--ink); }
.art.sqlwin .code i { font-style: normal; color: var(--bar-grey); text-align: right; padding-right: 10px; }
.art.sqlwin .kw { color: #4A6AA6; } .art.sqlwin .st { color: #1F7A5A; }
.art.sqlwin .status { border-top: 1px solid var(--line-2); padding: 5px 12px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); background: var(--paper-2); }
/* csv file */
.art.csv { padding: 14px; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; }
.art.csv > span { min-width: 0; }
.art.csv .ic { width: 34px; height: 42px; border: 1.5px solid var(--blue-3); border-radius: 4px; position: relative; background: var(--paper); }
.art.csv .ic::before { content: ""; position: absolute; right: -1px; top: -1px; width: 12px; height: 12px; background: var(--ground); border-left: 1.5px solid var(--blue-3); border-bottom: 1.5px solid var(--blue-3); }
.art.csv .ic::after { content: "CSV"; position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; font: 600 8px/1 var(--mono); color: var(--blue-3); }
.art.csv b { display: block; color: var(--ink); font-family: var(--mono); font-size: 11.5px; line-height: 1.3; overflow-wrap: anywhere; }
.art.csv small { font-size: 11px; color: var(--ink-3); }
/* spreadsheet */
.art.xls .fx { display: grid; grid-template-columns: 40px 1fr; font-family: var(--mono); font-size: 10.5px; border-bottom: 1px solid var(--line-2); }
.art.xls .fx span { padding: 5px 8px; } .art.xls .fx span:first-child { border-right: 1px solid var(--line-2); color: var(--ink-3); }
.art.xls .tw { overflow-x: auto; }
.art.xls table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 11px; }
.art.xls td, .art.xls th { border: 1px solid var(--line-2); padding: 4px 7px; text-align: left; white-space: nowrap; height: 24px; }
.art.xls th { background: var(--paper-2); color: var(--ink-3); font-weight: 500; text-align: center; }
.art.xls td.n { text-align: right; }
.art.xls td.sel { outline: 2px solid var(--navy); outline-offset: -2px; background: var(--tint); }
.art.xls td.err { color: var(--fail); }
/* screenshot window */
.art.shot .bars { display: flex; align-items: flex-end; gap: 14px; height: 74px; padding: 12px 16px 8px; }
.art.shot .bars div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; color: var(--ink-2); }
.art.shot .bars i { display: block; width: 36px; background: var(--navy); border-radius: 3px 3px 0 0; }
.art.shot .bars div + div i { background: var(--bar-grey); }
/* slide */
.art.slide .s { aspect-ratio: 16 / 9; padding: 12px 14px; display: grid; grid-template-rows: auto 1fr auto; }
.art.slide .s .t { font-size: 12.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
.art.slide .s .big { font-size: 30px; font-weight: 800; letter-spacing: -0.04em; color: var(--ink); align-self: center; line-height: 1; }
.art.slide .s .big small { display: block; font-size: 10.5px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; margin-top: 4px; }
.art.slide .s .ft { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); }
/* slack */
.art.slack .m { padding: 12px 14px; display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
.art.slack .av { width: 34px; height: 34px; border-radius: 7px; background: var(--navy); color: var(--ice); font: 600 11px/34px var(--mono); text-align: center; }
.art.slack b { color: var(--ink); } .art.slack .t { color: var(--ink-3); font-size: 10.5px; margin-left: 6px; }
.art.slack p { margin: 2px 0 0; color: var(--ink); font-size: 12.5px; }
.art.slack .rx { display: flex; gap: 6px; margin-top: 8px; }
.art.slack .rx span { border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; font-size: 10.5px; color: var(--ink-3); background: var(--paper-2); }
.art.slack .thr { font-size: 10.5px; color: var(--blue-3); margin-top: 6px; }
/* finding art */
.art.fnd { transform: none; border-radius: 14px; overflow: visible; }
.art.fnd .frame { border-radius: 14px; }
@container page (max-width: 900px) { .collage { aspect-ratio: auto; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; } .collage .wires { display: none; } .art { position: static; width: auto; transform: none; } .art.fnd { grid-column: 1 / -1; } }
@container page (max-width: 560px) { .collage { grid-template-columns: minmax(0,1fr); } .stack::before { transform: translate(5px, -5px) rotate(.4deg); } .stack::after { transform: translate(10px, -10px) rotate(.8deg); } .art.slide .s { aspect-ratio: auto; gap: 12px; } }

/* ============================================================
   Section components
   ============================================================ */
/* lanes (how it works) */
.lanes { display: grid; gap: 56px; }
.lane { display: grid; grid-template-columns: 180px minmax(0,1fr); gap: 32px; align-items: start; }
.lane .who { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); padding-top: 26px; }
.lane .who b { display: block; font-family: var(--sans); font-size: 18px; letter-spacing: -0.01em; text-transform: none; color: var(--ink); font-weight: 700; margin-top: 6px; }
.lane ol { list-style: none; margin: 0; padding: 26px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 28px; position: relative; }
.lane ol::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--line); }
.lane li { position: relative; }
.lane li::before { content: ""; position: absolute; left: 0; top: -30px; width: 9px; height: 9px; border-radius: 999px; background: var(--dot); box-shadow: 0 0 0 3px var(--ground); }
.lane li .k { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: .1em; }
.lane li b { display: block; font-size: 16px; font-weight: 600; margin: 6px 0 4px; letter-spacing: -0.01em; }
.lane li span { display: block; color: var(--ink-2); font-size: 14px; line-height: 1.45; }
.lane li code { display: inline-block; margin-top: 8px; font-size: 11.5px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; }
@container page (max-width: 900px) { .lane { grid-template-columns: minmax(0,1fr); gap: 12px; } .lane .who { padding-top: 0; } .lane ol { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
@container page (max-width: 560px) { .lane ol { grid-template-columns: minmax(0,1fr); } }

/* steps (operator) */
.steps { border-top: 1px solid var(--line); }
.step { display: grid; grid-template-columns: 64px minmax(0,1fr) 220px; gap: 24px; padding: 28px 0; border-bottom: 1px solid var(--line); align-items: start; }
.step .k { font-family: var(--mono); font-size: 12px; color: var(--ink-3); padding-top: 6px; letter-spacing: .1em; }
.step h3 { font-size: 21px; font-weight: 600; letter-spacing: -0.015em; margin-bottom: 6px; }
.step p { color: var(--ink-2); font-size: 15.5px; max-width: 52ch; }
.step code { font-size: 12.5px; background: var(--paper); border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px; display: inline-block; }
@container page (max-width: 820px) { .step { grid-template-columns: 48px 1fr; } .step > :nth-child(3) { grid-column: 2; } }

/* facts */
.facts-big { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.facts-big li { display: grid; grid-template-columns: 28px 220px minmax(0,1fr); gap: 20px; padding: 22px 0; border-bottom: 1px solid var(--line); align-items: start; }
.facts-big li b { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
.facts-big li span { color: var(--ink-2); font-size: 15.5px; line-height: 1.5; max-width: 60ch; }
.facts-big .mk { width: 22px; height: 22px; font-size: 12px; margin-top: 2px; }
@container page (max-width: 700px) { .facts-big li { grid-template-columns: 28px 1fr; } .facts-big li span { grid-column: 2; } }

/* badge vs facts */
.vs-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 32px; align-items: stretch; }
.vs-grid .pane { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 32px; position: relative; overflow: hidden; }
.vs-grid .pane .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 20px; }
.vs-grid .pane.bad { background: var(--paper-2); }
.badge-bad { position: relative; display: inline-flex; flex-wrap: wrap; max-width: 100%; align-items: center; gap: 10px 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; font-size: 18px; font-weight: 600; color: var(--ink-2); box-shadow: var(--shadow-float); }
.badge-bad .pct { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; color: var(--ink); line-height: 1; }
.badge-bad .v { display: inline-flex; align-items: center; gap: 6px; background: var(--pass-bg); color: var(--pass); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.badge-bad::after { content: ""; position: absolute; left: -6px; right: -6px; top: 50%; height: 3px; background: var(--fail); transform: rotate(-7deg); border-radius: 2px; }
.vs-grid .pane p { margin-top: 20px; color: var(--ink-2); font-size: 15px; max-width: 40ch; }
@container page (max-width: 820px) { .vs-grid { grid-template-columns: minmax(0,1fr); } }
@container page (max-width: 560px) { .badge-bad .pct { font-size: 30px; } .badge-bad { font-size: 15px; padding: 14px 16px; } .vs-grid .pane { padding: 22px; } }

/* checks table */
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th, .tbl td { text-align: left; padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.tbl code { font-size: 13px; }
.tbl-wrap { contain: inline-size; overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 6px 20px; }
.tbl code { overflow-wrap: anywhere; }
@container page (max-width: 640px) { .tbl { font-size: 13.5px; } .tbl th, .tbl td { padding: 10px 6px; } .tbl-wrap { padding: 4px 10px; } .st { font-size: 10px; padding: 2px 7px; } }
.st { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.st.holds { background: var(--pass-bg); color: var(--pass); }
.st.contra { background: var(--fail-bg); color: var(--fail); }
.st.insuf { background: var(--warn-bg); color: var(--warn); }
.st.nc { background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--line); }

/* strip */
.strip { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); border: 1px solid var(--line); border-radius: 14px; background: var(--paper); overflow: hidden; }
.strip > div { padding: 20px 18px; display: grid; gap: 8px; align-content: start; font-size: 13.5px; }
.strip > div + div { border-left: 1px solid var(--line-2); }
.strip b { font-weight: 600; font-size: 14px; }
.strip span { color: var(--ink-2); line-height: 1.45; }
.strip code { font-size: 12px; }
@container page (max-width: 900px) { .strip { grid-template-columns: minmax(0,1fr); } .strip > div + div { border-left: 0; border-top: 1px solid var(--line-2); } }

/* ticker */
.ticker { background: var(--navy); color: var(--ice); overflow: hidden; padding-block: 16px; font-family: var(--mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; }
.ticker .track { display: flex; gap: 44px; width: max-content; animation: tick 56s linear infinite; }
.ticker .track span { white-space: nowrap; }
.ticker .track span.ok::before { content: "✓ "; color: #7ED9B2; }
.ticker .track span.dim { opacity: .5; }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .ticker .track { animation: none; } }

/* revisit diff */
.rev { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--paper); box-shadow: var(--shadow-card); }
.rev > div { padding: 26px 28px; }
.rev > div + div { border-left: 1px solid var(--line); }
.rev h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin-bottom: 14px; }
.rev .claim { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-2); font-size: 15px; align-items: center; }
.rev .claim .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13.5px; }
@container page (max-width: 720px) { .rev { grid-template-columns: minmax(0,1fr); } .rev > div + div { border-left: 0; border-top: 1px solid var(--line); } }
/* revision stack */
.rev-stack { position: relative; padding-top: 44px; }
.rev-stack .sheet2 { position: absolute; left: 0; right: 0; top: 0; height: 140px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-float); }
.rev-stack .sheet2.b2 { transform: translate(30px, -4px) rotate(.8deg); opacity: .55; }
.rev-stack .sheet2.b1 { transform: translate(15px, 18px) rotate(.3deg); opacity: .85; }
@container page (max-width: 900px) { .rev-stack .sheet2.b2 { transform: translate(12px, -4px) rotate(.5deg); } .rev-stack .sheet2.b1 { transform: translate(6px, 12px) rotate(.2deg); } }
.rev-stack .sheet2 span { position: absolute; left: 16px; top: 10px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
.rev-stack .doc, .rev-stack .frame { position: relative; }
.rev-stack { contain: inline-size; }
.delta { display: inline-block; font-family: var(--mono); font-size: 11px; background: var(--pass-bg); color: var(--pass); border-radius: 5px; padding: 2px 7px; margin-left: 8px; vertical-align: middle; }
/* board */
.board { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
.board .card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 22px; font-size: 14.5px; box-shadow: var(--shadow-float); }
.board .card b { display: block; font-size: 17px; margin-bottom: 6px; letter-spacing: -0.01em; }
.board .card .who { color: var(--ink-3); font-size: 12.5px; margin-bottom: 14px; font-family: var(--mono); }
.board .card .rest { color: var(--ink-2); font-size: 14px; margin-top: 14px; line-height: 1.5; }
@container page (max-width: 820px) { .board { grid-template-columns: minmax(0,1fr); } }

/* engine / instance */
.ei { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px; }
.ei .box { border: 1px solid var(--line); border-radius: 16px; padding: 30px; background: var(--paper); box-shadow: var(--shadow-float); }
.ei .box.pub { background: var(--pub-bg); color: var(--ice); border-color: var(--pub-bg); }
.ei h3 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
.ei .sub { font-family: var(--mono); font-size: 12px; opacity: .7; margin-bottom: 22px; }
.ei ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 15px; }
.ei li { display: flex; gap: 10px; align-items: flex-start; }
.ei li::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: currentColor; opacity: .45; margin-top: 9px; flex: none; }
@container page (max-width: 760px) { .ei { grid-template-columns: minmax(0,1fr); } }
.tree { contain: inline-size; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; overflow-x: auto; box-shadow: var(--shadow-float); }
.tree pre { margin: 0; }
@container page (max-width: 560px) { .tree .c { display: none; } .tree { font-size: 11.5px; } }
.tree .c { color: var(--ink-3); }

/* figure with leader lines */
.fig { display: grid; grid-template-columns: 210px minmax(0, 1fr) 210px; min-width: 0; gap: 32px; align-items: start; }
.fig .side { position: relative; min-height: 560px; }

<h3>New users who saw the checklist came back within a week more often: ${ref('34.8%','retention_by_arm','checklist','retained_7d_rate')} compared with ${ref('28.5%','retention_by_arm','control','retained_7d_rate')}.</h3>
${chartSvg}`;
  const claimBody = `<dl><dt>Who is counted</dt><dd>Everyone who signed up 1 June to 12 July (New York time) and was randomly given one of the two onboardings, ${ref('1,277','retention_by_arm','total','signups')} people.</dd><dt>Compared with</dt><dd>The people randomly given the old onboarding at the same time.</dd><dt>When</dt><dd>Signups to 12 July, app opens through 19 July.</dd></dl>
<table><caption class="sr">Who was counted</caption><thead><tr><th>Onboarding</th><th class="num">New users</th><th class="num">Came back</th><th class="num">Share</th></tr></thead>
<tbody><tr><td>Checklist</td><td class="num">${ref('624','retention_by_arm','checklist','signups')}</td><td class="num">${ref('217','retention_by_arm','checklist','retained')}</td><td class="num">34.8%</td></tr><tr><td>Old onboarding</td><td class="num">${ref('653','retention_by_arm','control','signups')}</td><td class="num">${ref('186','retention_by_arm','control','retained')}</td><td class="num">28.5%</td></tr></tbody></table>
<details><summary>Who was left out, and the limits of this claim</summary><ul><li>People who signed up outside the window are not counted.</li><li>"Came back" says nothing about what they did in the app.</li><li>Six weeks of early-summer signups; a different season could behave differently.</li></ul></details>
<details><summary>How this number was calculated</summary><p>Share who came back = people who opened the app on any of days one to seven after signup ÷ everyone who signed up in that group. Definition <code>retained_7d</code> v2. Query <code>retention_by_arm</code>.</p></details>`;
  const checked = `<h2>How we checked</h2>
<ul class="facts">
<li><span class="mk ok">✓</span><b>Checks passed</b><span>No user counted twice · groups balanced · retained count reconciles with the approved definition</span></li>
<li><span class="mk wn">!</span><b>Definition</b><span>retained_7d v2, recorded as approved by Dana on 28 May. Not verified by this draft.</span></li>
<li><span class="mk ok">✓</span><b>Method review</b><span>Recorded 15 Sep by the author. No blocking findings.</span></li>
<li><span class="mk no">×</span><b>Publication approval</b><span>None. This is a draft.</span></li>
<li><span class="mk ok">✓</span><b>Data</b><span>Retained copy of users and app-open events. Replay and rerun both possible.</span></li>
</ul>`;
  const mind = `<h2>What would change our mind</h2><p>If the checklist group were not at least 3 pp ahead, with at least five hundred people in each group, the checklist did not help enough to keep. That test is written down and passed on this data.</p>`;
  const action = `<h2>Question or flag this Finding</h2><a class="action" href="#">Email Dana Okafor</a><p class="foot">Your message carries only the Finding and Claim ids, never the numbers. Finding <code>fnd_7k2m9q4w1xzb</code> r1 · covers 2026-06-01 to 2026-07-19.</p>`;
  if (mode === 'answer') return head;
  if (mode === 'answer+') return head + decision;
  if (mode === 'claim') return claimHead.replace('<h2>Evidence</h2>','') + claimBody.split('<details>')[0];
  if (mode === 'short') return head + decision + claimHead;
  if (mode === 'medium') return head + decision + claimHead + claimBody.split('<details>')[0] + checked;
  return head + decision + claimHead + claimBody + checked + mind + action;
}

V['how-hybrid'] = { name:'Two lanes', html: () => sec('How it works', `<div class="head"><h2 class="h2">Two people, one document.</h2><p class="lead">The Operator runs the analysis in whatever agent they use. The Reader gets a document on a phone. Neither has to learn the other's tools.</p></div><div class="lanes"><div class="lane"><div class="who">Operator<b>In the agent</b></div><ol><li><span class="k">01</span><b>Set up the Instance</b><span>Metric definitions, table docs, Reader profiles, decision log.</span><code>/setup-aftergrid</code></li><li><span class="k">02</span><b>Sharpen the question</b><span>Decision, metric, population, window, falsifier.</span><code>/grill-question</code></li><li><span class="k">03</span><b>Checked analysis</b><span>Checks first, then numbers, then two review subagents.</span><code>/analyze</code></li><li><span class="k">04</span><b>Review the PR, render</b><span>Approval binds to the content digest.</span><code>aftergrid render</code></li></ol></div><div class="lane"><div class="who">Reader<b>On a phone</b></div><ol><li><span class="k">01</span><b>Ask</b><span>"Did the checklist help?" in plain words.</span></li><li><span class="k">02</span><b>Read the answer</b><span>One sentence, then who was counted and compared with what.</span></li><li><span class="k">03</span><b>Inspect</b><span>Expand a number: calculation, exclusions, limits, evidence.</span></li><li><span class="k">04</span><b>Question or decide</b><span>One action, carrying only the Finding and Claim ids.</span></li></ol></div></div>`) };
V['how-operator'] = { name:'Operator steps', html: () => sec('How it works', `<div class="head"><h2 class="h2">Four commands between a question and a reviewed Finding.</h2></div><div class="steps"><div class="step"><span class="k">01</span><div><h3>Set up an Instance</h3><p>Your private repo of context: metric definitions, table docs, Reader profiles, decision log.</p></div><p><code>/setup-aftergrid</code></p></div><div class="step"><span class="k">02</span><div><h3>Sharpen the question</h3><p>Decision, metric, population, window and a falsifier. Vague asks are returned, not guessed at.</p></div><p><code>/grill-question</code></p></div><div class="step"><span class="k">03</span><div><h3>Run a checked analysis</h3><p>Checks are written before the numbers. Method and Reader subagents review the draft.</p></div><p><code>/analyze</code> · <code>aftergrid check</code></p></div><div class="step"><span class="k">04</span><div><h3>Render, review, merge</h3><p>A pull request in the Instance. Approval binds to a content digest. Then one HTML file for the Reader.</p></div><p><code>aftergrid render</code></p></div></div>`) };

V['oss-blurb'] = { name:'Blurb', html: () => sec('Open source', `<h2 class="h2">Why open source, and why now.</h2><div class="prose" style="margin-top:24px"><p>Every internal data-agent system we studied, at Ramp, Anthropic, Snap and elsewhere, agrees that the harness is a commodity and the value is in a team's own context and feedback loop. None of them ships the last mile: a document a non-data person can act on. The one product that does is closed.</p><p>aftergrid is that last mile, in the open: a fixed Finding shape, runnable Checks, evidence references on every number, and a Revisit when the data moves. MIT licensed. Your metric definitions and decisions live in your own repo, and the engine only ever holds verbs.</p></div>`) };

/* ===================== state ===================== */
const LS = 'aftergrid-landing-directions-v4';
let state = { layout:'skills', width:'desktop', face:'sans', surface:'auto', controls:'off', picks:{}, pref:'', notes:'' };
try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s && typeof s === 'object') state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
function picksFor(l) { state.picks[l] = state.picks[l] || {}; return state.picks[l]; }
function pick(slot) { const L = LAYOUTS[state.layout]; const v = picksFor(state.layout)[slot] || L.defaults[slot]; return (slot === 'headline' ? HEADLINES[v] : V[v]) ? v : L.defaults[slot]; }

/* ===================== render ===================== */
function render() {
  const L = LAYOUTS[state.layout] || LAYOUTS.skills; if (!LAYOUTS[state.layout]) state.layout = 'skills';
  const hl = HEADLINES[pick('headline')];
  const parts = L.order.map(slot => `<section class="sec" data-slot="${slot}">${slotControl(slot, pick(slot))}${V[pick(slot)].html(hl)}</section>`);
  parts.push(`<section class="sec">${V.footer.html()}</section>`);
  const surface = state.surface === 'auto' ? (L.surface || 'plain') : state.surface;
  document.getElementById('stage').innerHTML = `<div class="page ${L.cls}" id="top" data-surface="${surface}">${parts.join('')}</div>`;
  renderChrome(); renderSheet();
}
function slotControl(slot, current) {
  const S = SLOTS[slot];
  const pills = S.variants.map(v => `<button type="button" data-slot="${slot}" data-v="${v}" aria-pressed="${v===current}">${esc(V[v].name)}</button>`).join('');
  let extra = '';
  if (slot === 'hero') { const cur = pick('headline'); extra = `<span class="lbl">Headline</span><span class="vs">${SLOTS.headline.variants.map(v => `<button type="button" data-slot="headline" data-v="${v}" aria-pressed="${v===cur}" title="${esc(HEADLINES[v].h)}">${esc(HEADLINES[v].name)}</button>`).join('')}</span>`; }
  return `<div class="sec-ctl"><span class="lbl">${esc(S.label)}</span><span class="vs">${pills}</span>${extra}</div>`;
}
function renderChrome() {
  document.getElementById('layoutSeg').innerHTML = Object.entries(LAYOUTS).map(([k,l]) => `<button type="button" role="tab" data-l="${k}" aria-pressed="${k===state.layout}">${esc(l.name)}</button>`).join('');
  const w = document.getElementById('stageWrap'); w.dataset.width = state.width; w.dataset.controls = state.controls;
  document.querySelectorAll('#widthSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.w === state.width));
  document.querySelectorAll('#faceSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.face === state.face));
  document.querySelectorAll('#surfaceSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.surface === state.surface));
  document.documentElement.style.setProperty('--doc-face', state.face === 'serif' ? 'var(--serif)' : 'var(--sans)');
  const t = document.getElementById('ctlToggle'); t.textContent = state.controls === 'on' ? 'Hide variant controls' : 'Show variant controls'; t.setAttribute('aria-pressed', state.controls === 'on');
}
function renderSheet() {
  const L = LAYOUTS[state.layout];
  document.getElementById('dirRationale').textContent = L.name + '. ' + L.rationale;
  document.getElementById('picks').innerHTML = L.order.map(slot => {
    const v = pick(slot); const line = `<div class="pick"><span>${esc(SLOTS[slot].label)}: <b>${esc(V[v].name)}</b></span><code>${esc(v)}</code></div>`;
    return slot === 'hero' ? line + `<div class="pick"><span>Headline: <b>${esc(HEADLINES[pick('headline')].name)}</b></span><code>${esc(pick('headline'))}</code></div>` : line;
  }).join('');
  document.getElementById('dirPref').innerHTML = Object.entries(LAYOUTS).map(([k,l]) => `<button type="button" data-pref="${k}" aria-pressed="${k===state.pref}">${esc(l.name)}</button>`).join('');
  document.getElementById('notes').value = state.notes;
  document.getElementById('summary').value = summary();
}
function summary() {
  const lines = ['# aftergrid landing page picks', '', 'Preferred direction: ' + (state.pref ? LAYOUTS[state.pref].name : '(none yet)'), 'Surface: ' + state.surface + ' · Finding face: ' + state.face, ''];
  for (const [k, L] of Object.entries(LAYOUTS)) {
    const p = state.picks[k] || {}; const changed = Object.keys(p).filter(s => p[s] !== L.defaults[s]);
    lines.push(`## ${L.name}` + (k === state.pref ? ' (preferred)' : ''));
    for (const slot of [...L.order, 'headline']) {
      const v = p[slot] || L.defaults[slot]; const nm = slot === 'headline' ? `"${HEADLINES[v].h}"` : V[v].name;
      lines.push(`- ${SLOTS[slot].label}: ${v} (${nm})` + (changed.includes(slot) ? '  ← changed' : ''));
    }
    lines.push('');
  }
  lines.push('## Notes'); lines.push(state.notes || '(none)');
  return lines.join('\n');
}


/* popover positioning: flip up near the bottom, keep inside the page */
function placeTip(ref) {
  const tip = ref.querySelector('.tip'); if (!tip) return;
  ref.classList.remove('up'); tip.style.left = '';
  const r = ref.getBoundingClientRect();
  const vh = window.innerHeight;
  if (vh - r.bottom < 360 && r.top > 360) ref.classList.add('up');
  const page = ref.closest('.page') || document.body; const pr = page.getBoundingClientRect();
  const w = Math.min(380, pr.width * 0.88);
  const overflow = (r.left + w + 16) - pr.right;
  if (overflow > 0) tip.style.left = (-Math.min(overflow, r.left - pr.left - 16)) + 'px';
}
document.addEventListener('mouseover', (e) => { const ref = e.target.closest('.ref'); if (ref) placeTip(ref); });
document.addEventListener('focusin', (e) => { const ref = e.target.closest('.ref'); if (ref) placeTip(ref); });
document.addEventListener('click', (e) => {
  const ref = e.target.closest('.ref');
  document.querySelectorAll('.ref.open').forEach(r => { if (r !== ref) r.classList.remove('open'); });
  if (ref && !e.target.closest('.tip')) { ref.classList.toggle('open'); placeTip(ref); }
});

/* ===================== events ===================== */
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.l) { state.layout = b.dataset.l; save(); render(); window.scrollTo({ top: 0 }); return; }
  if (b.dataset.w) { state.width = b.dataset.w; save(); renderChrome(); return; }
  if (b.dataset.face) { state.face = b.dataset.face; save(); renderChrome(); return; }
  if (b.dataset.surface) { state.surface = b.dataset.surface; save(); const y = window.scrollY; render(); window.scrollTo({ top: y }); return; }
  if (b.dataset.slot && b.dataset.v) { picksFor(state.layout)[b.dataset.slot] = b.dataset.v; save(); const y = window.scrollY; render(); window.scrollTo({ top: y }); return; }
  if (b.dataset.pref !== undefined) { state.pref = state.pref === b.dataset.pref ? '' : b.dataset.pref; save(); renderSheet(); return; }
  if (b.id === 'ctlToggle') { state.controls = state.controls === 'on' ? 'off' : 'on'; save(); renderChrome(); return; }
  if (b.id === 'sheetOpen') { document.getElementById('sheet').dataset.open = 'true'; renderSheet(); return; }
  if (b.id === 'sheetClose') { document.getElementById('sheet').dataset.open = 'false'; return; }
  if (b.id === 'copyBtn') { const ta = document.getElementById('summary'); ta.select(); try { navigator.clipboard.writeText(ta.value).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy summary', 1500); }); } catch (err) { document.execCommand('copy'); } return; }
  if (b.id === 'resetBtn') { state.picks = {}; state.pref = ''; state.notes = ''; save(); render(); return; }
});
document.getElementById('notes').addEventListener('input', (e) => { state.notes = e.target.value; save(); document.getElementById('summary').value = summary(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.getElementById('sheet').dataset.open = 'false'; });
render();
</script>
