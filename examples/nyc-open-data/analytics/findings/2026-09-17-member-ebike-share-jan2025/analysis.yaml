schema_version: 0.1.0
stage: analysed
clarified_at: "2026-09-17T18:13:09Z"
reader_profile: bike_product_manager
assumptions:
  - id: a_operator_answers_from_instance
    statement: The Operator asked that clarification answers be taken from README.md, readers.md and the definitions rather than from an interview, and recorded here. No round of questions was put to a person.
    basis: operator_answer
    settled_by: Operator run context for this /analyze invocation, 2026-09-17
    affects: [decision, metric, population, window, primary_comparison, falsifier]
  - id: a_decision_from_reader_profile
    statement: The decision is whether e-bike use among member rides is growing, flat or moving with something else, whether a fee change is worth investigating properly, and what to put in front of the team as a question rather than an answer. Taken from the decisions list of the bike_product_manager profile, which is a composite and not a person and has never sat for a Reader session.
    basis: instance_document
    settled_by: readers.md, bike_product_manager
    affects: [decision]
  - id: a_metric_is_proposed_ebike_ride
    statement: "'Riding e-bikes' means ebike_ride v1: a Citi Bike ride whose rideable_type is 'electric_bike'. 'Members' means member_ride v1: a ride whose member_casual is 'member'. Both definitions are proposed and carry no approval block. The Operator, who owns them, directed that they be used as written and that their status be stated. Both are pinned with role supporting and neither may headline a published decision metric until approved."
    basis: operator_answer
    settled_by: Operator run context; definitions/ebike_ride.md; definitions/member_ride.md
    affects: [metric, population, publication]
  - id: a_share_denominator_is_member_rides
    statement: The share the Answer leads on is the share of member rides that were on an e-bike - e-bike member rides divided by all member rides in the same month, electric and classic together. ebike_ride v1 names three different shares that a Reader will confuse, so the member type the share sits inside is stated everywhere the number appears, and the total number of member rides is shown beside it.
    basis: instance_document
    settled_by: definitions/ebike_ride.md (denominator, and its warning about three shares)
    affects: [metric, primary_comparison, falsifier]
  - id: a_window_whole_months
    statement: The after period is the whole of January 2025 and the baseline is the whole of January 2024, as half-open ride-date ranges. January is compared with January so that a winter month is not read against a summer one.
    basis: operator_answer
    settled_by: Operator run context
    affects: [window, primary_comparison]
  - id: a_timezone_is_file_local
    statement: The analytical timezone is America/New_York. ride_date in citibike_daily is already the local start date the Citi Bike file carries and the build converts nothing, so the SQL applies no timezone conversion and the parameter is recorded without being used in a date expression.
    basis: instance_document
    settled_by: definitions/member_ride.md (window); definitions/ebike_ride.md (window)
    affects: [window]
  - id: a_no_fee_change_date_in_instance
    statement: No fee schedule, fee amount or fee change date for Citi Bike e-bikes is in any source this Instance reads, and none is in README.md or the definitions. The Analysis therefore asserts no fee change and no date for one, states fees as a plausible explanation it cannot test, and does not treat any day inside either month as before or after a change. This is why the Question is a descriptive comparison and not an evaluation of a fee change.
    basis: instance_document
    settled_by: definitions/ebike_ride.md; Operator run context
    affects: [primary_comparison, claims, publication]
  - id: a_fee_date_not_needed_by_this_question
    statement: "The Operator asked that a missing fee change date be recorded as needs_input only if the Question needs it, and in the same instruction scoped the Question to the descriptive January 2025 against January 2024 comparison. A descriptive comparison does not need the date, so needs_input is empty and the gap is carried as this assumption, as a Claim limitation and in outcome_recommendation.what_would_be_needed instead. Recording it as needs_input would have made an outcome of answered unavailable to a Question that can be answered as posed."
    basis: operator_answer
    settled_by: Operator run context for this /analyze invocation, 2026-09-17
    affects: [needs_input, outcome]
  - id: a_no_materiality_threshold
    statement: Nothing in the Instance records how large a change in e-bike share is large enough to act on. The Analysis reports the size of the change and does not label it large or small; the falsifier tests direction only.
    basis: instance_document
    settled_by: readers.md lists the decision but no threshold
    affects: [falsifier, claims]
  - id: a_weather_is_a_check_not_an_explanation
    statement: Weather is carried as a Check using comparable_weather_day v1, a proposed diagnostic, at the Operator's direction. It answers whether the two Januaries were alike enough on weather for the comparison to mean anything. It never headlines a Claim, a passing weather Check does not make the comparison causal, and version 1 tests maximum temperature and a wet/dry class only - it does not test snow.
    basis: operator_answer
    settled_by: Operator run context; definitions/comparable_weather_day.md
    affects: [claims]
  - id: a_falsifier_written_before_any_number
    statement: The falsifier was written and hashed at the clarify stage, after reading the source catalog (table and column names, and the planner's scan-row estimates) and before any ride count, e-bike count, share or comparison had been computed, and before any analysis query existed. Its SQL hash, required flag, expected outcome and statement hash are pinned in checks_preregistered below.
    basis: catalog_probe
    affects: [falsifier]
pre_registered_comparison:
  statement: The share of member rides taken on an e-bike (ebike_ride v1 within member_ride v1) over ride dates 2025-01-01 to 2025-01-31 against the same share for 2024-01-01 to 2024-01-31, with the count of member e-bike rides and the count of all member rides stated for both months. Secondary, also fixed before any number was seen - the same comparison for casual rides, the daily series of member e-bike share across both months, and the comparable_weather_day v1 count over the 31 aligned day pairs.
  registered_before_cuts: true
  registered_at: "2026-09-17T18:13:09Z"
  source: analysis.yaml, written at the clarify stage before any analysis query existed
