  - { kind: probe, id: p_python_unavailable }
  - { kind: probe, id: p_coverage }
  - { kind: probe, id: p_weather_result_known_in_advance }
  - { kind: check, id: falsifier_count_and_share_agree, note: "written first - at the clarify stage, before any other Check and before any query existed" }
  - { kind: check, id: inv_grain_unique_and_valid }
  - { kind: check, id: inv_no_third_bike_type }
  - { kind: check, id: inv_definition_sql_matches_analysis }
  - { kind: check, id: min_data_every_day_present }
  - { kind: check, id: min_data_weather_observed }
  - { kind: check, id: check_weather_comparable }
  - { kind: query, id: member_ebike_by_period, note: the pre-registered comparison }
  - { kind: query, id: rides_by_period_member_type }
  - { kind: query, id: member_ebike_daily }
  - { kind: query, id: weather_pairs }
  - { kind: query, id: weather_by_period }
  - { kind: query, id: source_provenance }
  - { kind: probe, id: p_statement_hash_shape, post_hoc: true, note: "after the first execute, which had already written the results" }
  - { kind: probe, id: p_read_results, post_hoc: true }
  - { kind: probe, id: p_derived_operand_order, post_hoc: true, note: "after the first review round, which found it" }
requested_derived:
  - id: member_ebike_rides_pct_change
    operation: percent_change
    operands: ["ref:member_ebike_by_period.after.member_ebike_rides", "ref:member_ebike_by_period.baseline.member_ebike_rides"]
    unit: ratio
    display: { kind: percent, decimals: 1 }
    description: Change in the number of member rides taken on an e-bike between the two Januaries
  - id: member_rides_pct_change
    operation: percent_change
    operands: ["ref:member_ebike_by_period.after.member_rides", "ref:member_ebike_by_period.baseline.member_rides"]
    unit: ratio
    display: { kind: percent, decimals: 1 }
    description: Change in the total number of member rides - the number the share sits on top of
  - id: member_classic_rides_pct_change
    operation: percent_change
    operands: ["ref:member_ebike_by_period.after.member_classic_rides", "ref:member_ebike_by_period.baseline.member_classic_rides"]
    unit: ratio
    display: { kind: percent, decimals: 1 }
    description: Change in the number of member rides taken on a classic bike
  - id: member_ebike_share_change
    operation: difference
    operands: ["ref:member_ebike_by_period.after.member_ebike_share", "ref:member_ebike_by_period.baseline.member_ebike_share"]
    unit: ratio
    display: { kind: percentage_points, decimals: 1 }
    description: Change in the share of member rides taken on an e-bike
  - id: casual_ebike_share_change
    operation: difference
    operands: ["ref:rides_by_period_member_type.after_casual.ebike_share", "ref:rides_by_period_member_type.baseline_casual.ebike_share"]
    unit: ratio
    display: { kind: percentage_points, decimals: 1 }
    description: Change in the share of casual rides taken on an e-bike
  - id: casual_rides_pct_change
    operation: percent_change
    operands: ["ref:rides_by_period_member_type.after_casual.all_rides", "ref:rides_by_period_member_type.baseline_casual.all_rides"]
    unit: ratio
    display: { kind: percent, decimals: 1 }
    description: Change in the total number of casual rides
  - id: mean_tmax_change_c
    operation: difference
    operands: ["ref:weather_by_period.after.mean_tmax_c", "ref:weather_by_period.baseline.mean_tmax_c"]
    unit: unknown
    display: { kind: decimal, decimals: 1 }
    description: Change in the mean daily maximum temperature in degrees Celsius
  - id: wet_days_change
    operation: difference
    operands: ["ref:weather_by_period.after.wet_days", "ref:weather_by_period.baseline.wet_days"]
    unit: days
    display: { kind: integer }
    description: Change in the number of days with 1 mm or more of precipitation
candidate_claims:
  - id: c1
    sentence_draft: Yes - members took more rides on e-bikes in January 2025 than in January 2024, and e-bikes were a bigger part of member riding. Members took 1,329,923 rides on e-bikes, up from 1,055,584, and e-bikes were 69.2% of all member rides, up from 62.9%.
    type: descriptive
    numeric: true
    answer_bearing: true
    evidence: ["ref:member_ebike_by_period.baseline.member_ebike_rides", "ref:member_ebike_by_period.after.member_ebike_rides", "ref:member_ebike_by_period.baseline.member_ebike_share", "ref:member_ebike_by_period.after.member_ebike_share", "derived:member_ebike_rides_pct_change", "derived:member_ebike_share_change"]
    definition_refs: [{ id: member_ride, version: 1 }, { id: ebike_ride, version: 1 }]
    comparison: { kind: baseline_period, description: The whole of January 2025 against the whole of January 2024, pre_registered: true }
    population: Citi Bike rides taken under a membership in the New York City monthly archives (member_ride v1, proposed), split by bike type (ebike_ride v1, proposed)
    window: { start: 2025-01-01, end: 2025-01-31, timezone: America/New_York }
    exclusions: [Jersey City rides are not in this build, Rides with a timestamp that does not parse or an end before its start were dropped by the build, A ride belongs to the month its start time falls in]
    limitations: [One month either side is not a trend, These are rides and not riders - the files carry no rider identity so the same person riding more often and more people riding look identical, member_ride v1 and ebike_ride v1 are proposed and not approved, No fee schedule, amount or change date for Citi Bike e-bikes is in any source this Instance reads, The two Januaries were not alike on weather, The retained input is the derived citibike_daily table and not the Citi Bike trip files, The Citi Bike archives were streamed and never hashed, and the publisher can restate them]
    material_caveat: This is a description of two Januaries, not an explanation of them. The two months were not alike on weather - only 10 of the 31 aligned day pairs were alike, and January 2025 was colder and much drier, which favours cycling - and nothing here separates that from a fee change, from more e-bikes in the system, or from a year of change in how people ride. This Instance records no date for any Citi Bike fee change, so this Finding asserts none.
    recheck_draft:
      mode: not_automatically_evaluable
      reason: The Instance holds four months and nothing after February 2025, so the same comparison cannot be run again on newer data from here.
      owner: Patrick Morris
      review_hint: Rebuild with January 2026 and rerun the same Checks unchanged.
  - id: c2
    sentence_draft: The bigger e-bike share is not a shrinking total. Member rides overall rose 14.5%, so e-bikes grew faster than member riding as a whole rather than growing because everything else fell - member rides on classic bikes fell 5.0%.
    type: descriptive
    numeric: true
    evidence: ["ref:member_ebike_by_period.baseline.member_rides", "ref:member_ebike_by_period.after.member_rides", "ref:member_ebike_by_period.baseline.member_classic_rides", "ref:member_ebike_by_period.after.member_classic_rides", "derived:member_rides_pct_change", "derived:member_classic_rides_pct_change", "derived:member_ebike_rides_pct_change"]
    definition_refs: [{ id: member_ride, version: 1 }, { id: ebike_ride, version: 1 }]
    comparison: { kind: baseline_period, description: The whole of January 2025 against the whole of January 2024, pre_registered: true }
    population: Citi Bike rides taken under a membership in the New York City monthly archives (member_ride v1, proposed)
    window: { start: 2025-01-01, end: 2025-01-31, timezone: America/New_York }
    exclusions: [Jersey City rides are not in this build]
    limitations: [A count of rides is not a count of riders, A rise in member rides is not a rise in members - the data cannot tell the two apart]
    recheck_draft:
      mode: not_automatically_evaluable
      reason: Later months are not in the Instance.
      owner: Patrick Morris
  - id: c3
    sentence_draft: Casual riders moved the same way, so this is not something happening only to members. The e-bike share of casual rides rose from 76.3% to 81.0%, and casual riders were already more likely to take an e-bike than members were - on a casual ride total that fell 3.0%.
    type: descriptive
    numeric: true
    evidence: ["ref:rides_by_period_member_type.baseline_casual.ebike_share", "ref:rides_by_period_member_type.after_casual.ebike_share", "ref:rides_by_period_member_type.baseline_member.ebike_share", "ref:rides_by_period_member_type.after_member.ebike_share", "derived:casual_ebike_share_change", "derived:casual_rides_pct_change"]
    definition_refs: [{ id: ebike_ride, version: 1 }, { id: member_ride, version: 1 }]
    comparison: { kind: baseline_period, description: Each member type in January 2025 against itself in January 2024, pre_registered: true }
    population: All Citi Bike rides in the New York City monthly archives, split by whether the ride was taken under a membership
    window: { start: 2025-01-01, end: 2025-01-31, timezone: America/New_York }
    exclusions: []
    limitations: [Casual covers both a single ride and a day pass and the data does not separate them, The casual share sits on a much smaller number of rides than the member share, Two groups moving together does not say what moved them]
    recheck_draft:
      mode: not_automatically_evaluable
      reason: Later months are not in the Instance.
      owner: Patrick Morris
  - id: c4
    sentence_draft: The two Januaries were not alike on weather. Only 10 of the 31 aligned day pairs were alike by the rule this Analysis pre-registered, and January 2025 was colder - a mean daily maximum of 2.6 against 5.5 degrees Celsius - and much drier, with 4 days of rain or more against 15.
    type: descriptive
    numeric: true
    evidence: ["ref:weather_pairs.comparable.day_pairs", "ref:weather_pairs.not_comparable.day_pairs", "ref:weather_pairs.comparable.all_day_pairs", "ref:weather_by_period.baseline.mean_tmax_c", "ref:weather_by_period.after.mean_tmax_c", "ref:weather_by_period.baseline.wet_days", "ref:weather_by_period.after.wet_days", "ref:weather_by_period.baseline.total_snow_mm", "ref:weather_by_period.after.total_snow_mm", "derived:mean_tmax_change_c", "derived:wet_days_change"]
    definition_refs: [{ id: comparable_weather_day, version: 1 }]
    comparison: { kind: baseline_period, description: Day n of January 2025 against day n of January 2024 at Central Park, pre_registered: true }
    population: Aligned day pairs with a maximum temperature and a precipitation observation at station USW00094728
    window: { start: 2025-01-01, end: 2025-01-31, timezone: America/New_York }
    exclusions: []
    limitations: [comparable_weather_day v1 is a proposed diagnostic and does not test snow, and January 2025 had more snow by depth than January 2024, Pairs are aligned by day of the month and not by day of the week, A weather match would not make the comparison causal and a mismatch does not by itself explain the difference in riding, One weather station stands for the whole city]
    recheck_draft:
      mode: not_automatically_evaluable
      reason: A diagnostic about two fixed months does not change with new data.
      owner: Patrick Morris
  - id: c5
