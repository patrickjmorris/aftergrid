probes:
  - id: p_catalog
    at: "2026-09-17T18:11:43Z"
    kind: exploratory
    question: Which tables and columns exist, and which can be captured under the admission cap?
    observed: aftergrid capture --catalog listed 10 tables and wrote nothing. citibike_daily has ride_date, member_casual, rideable_type, rides and duration_seconds_sum, 484 scan rows. weather_daily has observation_date, station_id, tmax_c, tmin_c, prcp_mm and snow_mm, 98 scan rows. build_provenance has source, url, period, bytes, sha256, fetch_mode and the HTTP headers. trips_daily is 5,390,695 scan rows, over the cap of 5,000,000, and is not admissible. No count, total or share was computed.
    changed_plan: The plan reads citibike_daily for every ride number, weather_daily for the weather Check, and build_provenance for what the two Citi Bike months were built from. citibike_stations, crz_daily, taxi_zones, crz_zones, trips_sample and trips_daily are not captured, because no Claim reads them.
  - id: p_python_unavailable
    at: "2026-09-17T18:17:17Z"
    kind: dead_end
    question: Can the retained CSVs be read with python3 for a structural look before the Checks are written?
    observed: The harness refused the python3 command in this session, so nothing was read that way. The time here is the clock read when the Check files were hashed, straight after; the refusal itself was not separately timed. Node's standard library was used instead for the structural probe below.
    changed_plan: Structural probes were taken with node reading the CSVs as text. Every number that reaches the Finding runs through aftergrid execute, not through either of these.
  - id: p_coverage
    at: "2026-09-17T18:17:17Z"
    kind: exploratory
    question: Are both Januaries whole in citibike_daily and weather_daily, is there a third bike type, and are there missing or negative values?
    observed: citibike_daily holds 124 rows over 31 distinct days for each of 2024-01, 2024-12 and 2025-01 and 112 rows over 28 days for 2025-02, which is 31 days by two member types by two bike types. member_casual takes only 'member' and 'casual'; rideable_type takes only 'classic_bike' and 'electric_bike', with no docked_bike in any of the four months. No blank or negative ride count and no blank duration anywhere. weather_daily has 31 observed days in each January with no missing maximum temperature, precipitation or snow, at one station. Row, day and distinct-value counts only; no ride total, e-bike total or share was computed. The time here is the clock read when the Check files were hashed, straight after this look; the look itself was not separately timed.
    changed_plan: Both whole-month windows are available and the e-bike share is a two-way split over these months. The Checks were written next, before any analysis query existed - including inv_no_third_bike_type, which turns this look into something the Finding asserts rather than something the analyst remembers.
  - id: p_weather_result_known_in_advance
    at: "2026-09-17T18:17:17Z"
    kind: exploratory
    question: Was anything about these two Januaries already known before the weather Check's bar was set?
    observed: "Yes, and it is recorded here rather than left out. Another Finding in this Instance, findings/2026-09-17-crz-trips-after-pricing, compares the same two Januaries and its analysis.yaml states that fewer than half of the aligned day pairs had comparable weather and that January 2025 was colder and much drier. That file was read while reading the Instance at the start of this run, so the weather Check's bar of more than half comparable was set in the knowledge that it would probably fail. The bar is still the natural one and it is set in the direction that makes the Finding harder rather than easier, but it is not a blind pre-registration and must not be described as one."
    changed_plan: The weather Check was written and pre-registered anyway, with required false, and this probe records what was known. Nothing was known about any Citi Bike ride, e-bike or share number - that neighbouring Finding is about yellow taxi and for-hire trips and reads no Citi Bike table - so the falsifier's pre-registration is unaffected.
  - id: p_statement_hash_shape
    at: "2026-09-17T18:19:30Z"
    kind: dead_end
    question: Does the pre-registration validate as first written?
    observed: The first aftergrid execute ran every query and Check and then reported analysis_contract at checks_preregistered/0/statement_hash - the falsifier's statement hash had been written as a bare string where the schema wants an object with algorithm and value. The time here was read when the repair was made, straight after the report. Only the shape of that one field changed; the hash value, the SQL, the required flag and the expected outcome are the ones written at 2026-09-17T18:12:36Z.
    changed_plan: statement_hash was rewritten as an object with the same value. No Check, threshold, requirement or expected outcome changed.
  - id: p_read_results
    at: "2026-09-17T18:21:45Z"
    kind: exploratory
    question: What did the pinned results and Checks show?
    observed: "Three required invariants passed, including the one that says there is no third bike type. Both minimum_data Checks passed - both months whole, weather observed on all 62 days. The falsifier recorded pass - member rides on e-bikes went 1,055,584 to 1,329,923 and the e-bike share of member rides went 62.85% to 69.18%, both up, so the two ways of reading 'more' agree. check_weather_comparable recorded fail - 10 of 31 aligned day pairs alike on weather, 21 not, none unknown - which is a business result the memo explains, not an engine failure. January 2025 was colder (mean maximum 2.55 against 5.53 degrees Celsius) and much drier (4 wet days against 15, 15.5 mm against 134.1 mm) with more snow by depth (77 mm against 58 mm)."
    changed_plan: The recommendation is answered, with the weather mismatch carried as the material caveat beside the Answer rather than in a footnote. No Check, threshold or requirement was altered after any result was seen.
  - id: p_derived_operand_order
    at: "2026-09-17T19:40:00Z"
    kind: dead_end
    question: Do the four percent_change derived values compute the change the Finding's prose claims they do?
    observed: "No, as method review found. percent_change is 100 x (a - b) / b, so its operands read after-then-baseline; all four entries - member_ebike_rides_pct_change, member_rides_pct_change, member_classic_rides_pct_change and casual_rides_pct_change - were written baseline-then-after in both requested_derived here and manifest.derived, so every rendered percent change carried the opposite sign to the movement its own result records. aftergrid check reported no error at any point, because both operand orders are valid arithmetic on the same two pinned values; this was method review's catch, not the engine's. The two difference entries and the two share-change entries were already after-then-baseline and were not touched."
    changed_plan: "The operand order on those four entries was swapped to after-then-baseline in requested_derived and in manifest.derived, on the operator's decision of 2026-09-17. No query, Check, result, threshold, expected outcome or falsifier changed, and no number in any results file changed - a derived value is computed from the pinned results at check and render time, so the repair needed no re-execution. The three reviews recorded before it bind the previous content digest and were run again against the repaired one."
