external_sources: []
claims:
  - id: c1
    type: descriptive
    numeric: true
    answer_bearing: true
    sentence: "Members rode e-bikes more in {{literal:January 2025}} than in {{literal:January 2024}}, both in rides and as a share of their riding: {{ref:member_ebike_by_period.after.member_ebike_rides}} e-bike rides against {{ref:member_ebike_by_period.baseline.member_ebike_rides}}, and {{ref:member_ebike_by_period.after.member_ebike_share}} of member rides against {{ref:member_ebike_by_period.baseline.member_ebike_share}}."
    evidence: [ ref:member_ebike_by_period.baseline.member_ebike_rides, ref:member_ebike_by_period.after.member_ebike_rides, ref:member_ebike_by_period.baseline.member_ebike_share, ref:member_ebike_by_period.after.member_ebike_share, derived:member_ebike_rides_pct_change, derived:member_ebike_share_change ]
    chart_ids: [ member_ebike_share_chart ]
    table_ids: [ member_ebike_by_period_table ]
    population: "Every Citi Bike ride taken under a membership in the New York City monthly archives, on ride dates 2024-01-01 to 2024-01-31 and 2025-01-01 to 2025-01-31. These are rides, not riders: the files carry no rider identity."
    comparison: { kind: baseline_period, description: "The whole of January 2025 against the whole of January 2024, month against the same month a year earlier.", pre_registered: true }
    window: { start: "2025-01-01", end: "2025-01-31", timezone: America/New_York }
    exclusions:
      - Jersey City rides are in separate files that this build does not fetch, so they are absent rather than zero.
      - Rides whose start or end time does not read, or whose end comes before its start, were dropped by the build rather than counted.
      - A ride belongs to the month its start time falls in, so a ride that crossed midnight on the last day of a month is counted in the month it started.
    limitations:
      - One month either side is not a trend.
      - The word "members" here counts rides taken under a membership, never people. One member taking two hundred rides and two hundred members taking one each look identical.
      - The two definitions used, member_ride v1 and ebike_ride v1, are proposals their owner has not approved.
      - No fee schedule, fee amount or fee change date for Citi Bike e-bikes is in any source this Instance reads, so this Finding names none.
      - The two Januaries were not alike on weather.
      - What was kept is the daily summary table, not the Citi Bike trip files themselves, and Citi Bike can republish a month.
    material_caveat: "These are rides, not riders: the files carry no rider identity, so one member riding far more often and many more members riding look exactly the same here. And this describes two Januaries rather than explaining them - the two months were not alike on weather, {{literal:January 2025}} being colder and much drier, and nothing here separates that from a fee change, from more e-bikes in the system, or from a year of change in how people ride. The weather test behind that was written before any weather number was read from the data kept here, but it was not a blind test: another Finding in this Instance covering the same two months had already reported the weather as not alike, so the likely outcome was known when the bar was set. This Instance records no date for any Citi Bike fee change, so this Finding names none."
    recheck:
      mode: not_automatically_evaluable
      reason: The Instance holds four months of Citi Bike data and nothing after February 2025, so the same comparison cannot be run again on newer data from here.
      owner: Patrick Morris
      review_hint: Rebuild the data with January 2026 in it and rerun the same Checks unchanged.
  - id: c2
    type: descriptive
    numeric: true
    sentence: "The bigger share is not a shrinking total: members took {{ref:member_ebike_by_period.after.member_rides}} rides in all, up from {{ref:member_ebike_by_period.baseline.member_rides}}, while their rides on classic bikes went from {{ref:member_ebike_by_period.baseline.member_classic_rides}} to {{ref:member_ebike_by_period.after.member_classic_rides}}."
    evidence: [ ref:member_ebike_by_period.baseline.member_rides, ref:member_ebike_by_period.after.member_rides, ref:member_ebike_by_period.baseline.member_classic_rides, ref:member_ebike_by_period.after.member_classic_rides, derived:member_rides_pct_change, derived:member_classic_rides_pct_change, derived:member_ebike_rides_pct_change ]
    chart_ids: [ member_rides_total_chart ]
    table_ids: [ member_rides_split_table ]
    population: The same member rides as above, split by whether the bike was electric or classic.
    comparison: { kind: baseline_period, description: "The whole of January 2025 against the whole of January 2024.", pre_registered: true }
    window: { start: "2025-01-01", end: "2025-01-31", timezone: America/New_York }
    exclusions:
      - Jersey City rides are not in this build.
    limitations:
      - A count of rides is not a count of riders, so more member rides is not the same as more members.
      - Both months are whole calendar months, but their weekend days do not fall in the same places, and this Finding does not adjust for that.
    recheck:
      mode: not_automatically_evaluable
      reason: Later months are not in the Instance.
      owner: Patrick Morris
  - id: c3
    type: descriptive
    numeric: true
    sentence: "Casual riders moved the same way, so this is not something happening only to members: e-bikes were {{ref:rides_by_period_member_type.after_casual.ebike_share}} of casual rides against {{ref:rides_by_period_member_type.baseline_casual.ebike_share}} a year earlier, on a casual ride total that changed by {{derived:casual_rides_pct_change}}."
    evidence: [ ref:rides_by_period_member_type.baseline_casual.ebike_share, ref:rides_by_period_member_type.after_casual.ebike_share, ref:rides_by_period_member_type.baseline_member.ebike_share, ref:rides_by_period_member_type.after_member.ebike_share, derived:casual_ebike_share_change, derived:casual_rides_pct_change ]
    table_ids: [ rides_by_member_type_table ]
    population: Every Citi Bike ride in the New York City monthly archives in the two months, split by whether it was taken under a membership.
    comparison: { kind: baseline_period, description: "Each kind of rider in January 2025 against the same kind of rider in January 2024.", pre_registered: true }
    window: { start: "2025-01-01", end: "2025-01-31", timezone: America/New_York }
    exclusions: []
    limitations:
      - Casual covers both a single ride and a day pass, and these files do not separate them.
      - The casual share sits on far fewer rides than the member share, so it moves more easily.
      - Two groups moving together does not say what moved them.
    recheck:
      mode: not_automatically_evaluable
      reason: Later months are not in the Instance.
      owner: Patrick Morris
  - id: c4
    type: descriptive
    numeric: true
    sentence: "The two Januaries were not alike on weather: {{ref:weather_pairs.comparable.day_pairs}} of {{ref:weather_pairs.comparable.all_day_pairs}} matched-up days were alike, and {{literal:January 2025}} was colder and much drier."
    evidence: [ ref:weather_pairs.comparable.day_pairs, ref:weather_pairs.not_comparable.day_pairs, ref:weather_pairs.comparable.all_day_pairs, ref:weather_by_period.baseline.mean_tmax_c, ref:weather_by_period.after.mean_tmax_c, ref:weather_by_period.baseline.wet_days, ref:weather_by_period.after.wet_days, ref:weather_by_period.baseline.total_snow_mm, ref:weather_by_period.after.total_snow_mm, derived:mean_tmax_change_c, derived:wet_days_change ]
    table_ids: [ weather_pairs_table, weather_by_period_table ]
    population: Pairs of days matched up by day of the month, with a maximum temperature and a precipitation reading at the Central Park weather station.
    comparison: { kind: baseline_period, description: "Day by day through January 2025 against the same day number in January 2024, at one weather station.", pre_registered: true }
    window: { start: "2025-01-01", end: "2025-01-31", timezone: America/New_York }
    exclusions: []
    limitations:
      - The rule used here looks at the daily high temperature and at whether the day was wet or dry. It does not look at snow, and January 2025 had more snow by depth than January 2024.
      - Days are matched by their number in the month, not by the day of the week.
      - One weather station stands in for the whole city.
      - Two months being alike on weather would not make this comparison a cause, and their not being alike does not by itself explain the difference in riding.
    recheck:
      mode: not_automatically_evaluable
      reason: A description of the weather in two fixed months does not change when new data arrives.
      owner: Patrick Morris
  - id: c5
    type: descriptive
    numeric: true
    sentence: "Both months come from Citi Bike archive files republished on the same day, {{ref:source_provenance.2025-01.http_last_modified}}, and read as a stream rather than kept, so each file is identified by its size and that date rather than by a fingerprint of its contents."
    evidence: [ ref:source_provenance.2024-01.http_last_modified, ref:source_provenance.2025-01.http_last_modified, ref:source_provenance.2024-01.bytes, ref:source_provenance.2025-01.bytes ]
    table_ids: [ source_provenance_table ]
    population: The two Citi Bike monthly archive files this Finding's ride numbers were built from.
    comparison: { kind: none, description: "A record of what was read, not a comparison.", pre_registered: false }
    window: { start: "2025-01-01", end: "2025-01-31", timezone: America/New_York }
    exclusions: []
    limitations:
      - Citi Bike can republish a month after the fact, and a rebuild could then disagree with these numbers.
      - A streamed file has no fingerprint, so a rebuild cannot prove it read the same bytes - only a file of the same size with the same publication date.
    recheck:
      mode: not_automatically_evaluable
      reason: What was read is a fact about this build, not something a later run re-tests.
      owner: Patrick Morris
