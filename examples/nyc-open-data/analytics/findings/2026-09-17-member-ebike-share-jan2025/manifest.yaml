reader:
  profile: bike_product_manager
question:
  id: member_ebike_share_jan2025
  raw_ask: Are Citi Bike members riding e-bikes more than they were a year ago?
  state: resolved
  decision: Whether e-bike use among member rides is growing, flat or moving with something else, and so whether to put it in front of the team as a question rather than an answer and whether a fee change is worth investigating properly. Owned by the bike share product manager this Finding is written for (Reader profile bike_product_manager).
  metric:
    id: ebike_ride
    version: 1
  population: "Citi Bike rides in the New York City monthly archives taken under a membership - member_ride v1, member_casual = 'member'. These are rides, not riders: the files carry no rider identity and no repeat-rider link, so one member taking two hundred rides is two hundred member rides. Jersey City files are not in this build, and rides with unusable timestamps were dropped by the build rather than counted."
  window:
    start: 2025-01-01
    end: 2025-01-31
    timezone: America/New_York
  primary_comparison: The share of member rides taken on an e-bike over the whole of January 2025 (1 to 31 January inclusive) against the whole of January 2024 (the baseline period), with the number of member rides on e-bikes and the total number of member rides stated for both months. The Instance records no date for any Citi Bike fee change, so no day inside either month is treated as before or after one.
  falsifier:
    kind: check
    check_id: falsifier_count_and_share_agree
    expected_outcome: pass
    statement: "The Answer names one direction for member e-bike riding between January 2024 and January 2025. It is wrong if the two ways of reading 'more' disagree: if the number of member rides on e-bikes and the share of member rides that were on e-bikes did not move the same way."
