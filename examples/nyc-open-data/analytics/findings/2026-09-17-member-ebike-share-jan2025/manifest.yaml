coverage:
  data_from: 2024-01-01
  data_to: 2025-02-28
  description: >-
    The Citi Bike ride numbers come from a kept copy of the daily ride-count table, which holds January 2024, December 2024, January 2025 and February 2025 and nothing else. The weather comes from a kept copy of the daily readings at the Central Park station, which stop on 2025-02-05. This Finding reads only the two Januaries out of that; the months in between are not in the data at all, so nothing here shows what happened between them. Jersey City rides, and any month after February 2025, are not covered.
