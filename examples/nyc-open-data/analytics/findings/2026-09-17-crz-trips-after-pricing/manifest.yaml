question:
  id: crz_trips_after_pricing
  raw_ask: Did trips into the Congestion Relief Zone change after congestion pricing started, compared with the same period a year earlier?
  state: resolved
  decision: What the transport programme lead reports upward about how trips into the Congestion Relief Zone in January 2025 compare with January 2024, how firmly to say it, and whether to wait for a longer period after the charge before drawing a conclusion. Owned by the programme lead this Finding is written for (Reader profile city_transport_analyst).
  metric:
    id: crz_trip
    version: 1
  population: Yellow taxi and high-volume for-hire (app-based, such as Uber and Lyft) trips that started or ended in one of the 38 taxi zones of the Congestion Relief Zone, counted once each on their pickup date. Green taxis, other for-hire vehicles, private cars, buses and the subway are not in the data.
  window:
    start: 2025-01-01
    end: 2025-01-31
    timezone: America/New_York
  primary_comparison: Total trips into the zone over the whole of January 2025 (the after period, 1 to 31 January inclusive) against the whole of January 2024 (the baseline period), yellow taxi and high-volume for-hire together. The Instance records no start date for the charge, so the after period is the calendar month and no date inside it is treated as the start.
  falsifier:
    kind: check
    check_id: falsifier_direction_holds_by_day_type
    expected_outcome: pass
    statement: The Answer names the direction in which trips into the zone moved between January 2024 and January 2025. It is wrong if that direction is only a calendar effect, that is, if average trips into the zone per weekday or per weekend day did not move the same way as the monthly total.
