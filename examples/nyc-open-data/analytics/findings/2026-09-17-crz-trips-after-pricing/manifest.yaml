claims:
  - id: c1
    type: descriptive
    numeric: true
    answer_bearing: true
    sentence: "This Analysis cannot say which way weekday trips into the zone moved: across the whole month the average weekday had {{derived:weekday_per_day_pct_change}} more trips into the zone than the same month a year earlier, but over the {{ref:weather_matched_pairs.weekday.comparable_pairs}} pairs of weekdays that were alike, trips into the zone changed by {{derived:matched_weekday_pct_change}}."
    evidence:
      - ref:crz_by_day_type.baseline_weekday.crz_trips_per_day
      - ref:crz_by_day_type.after_weekday.crz_trips_per_day
      - derived:weekday_per_day_pct_change
      - ref:crz_by_day_type.baseline_weekday.days
      - ref:crz_by_day_type.after_weekday.days
      - ref:weather_matched_pairs.weekday.comparable_pairs
      - ref:weather_matched_pairs.weekday.matched_pairs
      - ref:weather_matched_pairs.weekday.holiday_pairs
      - ref:weather_matched_pairs.weekday.not_comparable_pairs
      - ref:weather_matched_pairs.weekday.base_crz_trips_per_day
      - ref:weather_matched_pairs.weekday.after_crz_trips_per_day
      - derived:matched_weekday_pct_change
    chart_ids:
      - trips_per_day_by_day_type_chart
    table_ids:
      - alike_weekday_pairs_table
    population: Yellow taxi and app-based for-hire (high-volume, such as Uber and Lyft) trips that started or ended in one of the {{literal:38}} taxi zones of the Congestion Relief Zone, counted once each on the day they started, on Mondays to Fridays. This uses the definitions crz_trip v1 and weekday_share v1, both proposed and not approved.
    comparison:
      kind: baseline_period
      description: Average trips into the zone per weekday in January 2025 against January 2024 and the same over matched day pairs with comparable weather
      pre_registered: false
    window:
      start: 2025-01-01
      end: 2025-01-31
      timezone: America/New_York
    exclusions:
      - Green taxis and other for-hire vehicles are not in the data at all.
      - Private cars, buses, the subway and bikes are not in the data.
      - Trips with an unknown zone at both ends never count as into the zone; they stay in all trips.
      - The pairs of days that were alike leave out 2024-01-01, 2024-01-02, 2025-01-30 and 2025-01-31, which have no partner on the same day of the week, and any pair with a public holiday on either side.
    limitations:
      - Looking at weekdays and weekend days apart was chosen after an earlier run had shown the monthly totals, so this is a follow-up look and not a comparison planned before the data was seen.
      - Five pairs of days is the fewest the test allowed. Three of them fell and two rose.
      - Two of the five pairs set 2025-01-02 and 2025-01-03, the two days straight after New Year's Day, against 2024-01-04 and 2024-01-05, which were further from the holiday. This was noticed after the result and was not tested.
      - One month either side is not a trend.
      - The Instance records no start date for the charge, so no day inside the month is treated as before it.
      - crz_trip v1, weekday_share v1 and comparable_weather_day v1 are proposed and not approved.
      - Public holidays count as weekdays in the whole-month averages.
      - comparable_weather_day v1 does not look at snow.
      - The holiday dates and the minimum numbers of pairs are the analyst's choices and rest on no document in the Instance.
      - Trip records carry no rider identity, so this is about trips and not about people.
      - The data kept with this Finding is the daily table crz_daily, derived from the TLC trip files, and not the trip files themselves.
      - The TLC restates published months, and the app-based for-hire files were read without a file hash.
    material_caveat: "The test written down before any new query was run asked whether each direction still holds among days that were alike (same day of the week, no public holiday, comparable weather). It recorded fail for weekdays and could not be run for weekend days. Whichever way trips moved, a difference between {{literal:January 2024}} and {{literal:January 2025}} is not the effect of the charge: nothing here separates the charge from weather, from a year of change in how people travel, or from growth in taxi and app-based trips across the city."
    recheck:
      mode: not_automatically_evaluable
      reason: The pre-registered falsifier failed on this data and later months are not in the Instance.
      owner: Patrick Morris
      review_hint: Rebuild with later months and the same months a year earlier, and rerun the same Checks unchanged.
  - id: c2
    type: descriptive
    numeric: true
    sentence: "The average weekend day had fewer trips into the zone than the same month a year earlier, a change of {{derived:weekend_per_day_pct_change}}, and that direction could not be tested: only {{ref:weather_matched_pairs.weekend.comparable_pairs}} of the {{ref:weather_matched_pairs.weekend.matched_pairs}} matched weekend pairs had comparable weather."
    evidence:
      - ref:crz_by_day_type.baseline_weekend.crz_trips_per_day
      - ref:crz_by_day_type.after_weekend.crz_trips_per_day
      - derived:weekend_per_day_pct_change
      - ref:crz_by_day_type.baseline_weekend.days
      - ref:crz_by_day_type.after_weekend.days
      - ref:weather_matched_pairs.weekend.comparable_pairs
      - ref:weather_matched_pairs.weekend.matched_pairs
    table_ids:
      - trips_per_day_table
    population: The same trips into the zone, on Saturdays and Sundays (crz_trip v1 and weekday_share v1, both proposed and not approved).
    comparison:
      kind: baseline_period
      description: Average trips into the zone per weekend day in January 2025 against January 2024
      pre_registered: false
    window:
      start: 2025-01-01
      end: 2025-01-31
      timezone: America/New_York
    exclusions:
      - Green taxis and other for-hire vehicles are not in the data at all.
      - Private cars, buses, the subway and bikes are not in the data.
    limitations:
      - A month has few weekend days, so one unusual Saturday moves the average.
      - The direction was not tested. The test needed three weekend pairs that were alike and found fewer.
      - Looking at weekdays and weekend days apart was chosen after an earlier run had shown the monthly totals.
      - crz_trip v1, weekday_share v1 and comparable_weather_day v1 are proposed and not approved.
    recheck:
      mode: not_automatically_evaluable
      reason: Later months are not in the Instance.
      owner: Patrick Morris
  - id: c3
    type: descriptive
    numeric: true
    sentence: "Trips into the zone were a smaller share of all taxi and app-based trips on both kinds of day: {{ref:crz_by_day_type.after_weekday.crz_share}} out of all weekday trips, from {{ref:crz_by_day_type.baseline_weekday.crz_share}} a year earlier, and {{ref:crz_by_day_type.after_weekend.crz_share}} out of all weekend trips, from {{ref:crz_by_day_type.baseline_weekend.crz_share}}."
    evidence:
      - ref:crz_by_day_type.baseline_weekday.crz_share
      - ref:crz_by_day_type.after_weekday.crz_share
      - derived:weekday_share_change
      - ref:crz_by_day_type.baseline_weekend.crz_share
      - ref:crz_by_day_type.after_weekend.crz_share
      - derived:weekend_share_change
      - derived:weekday_all_trips_pct_change
      - derived:weekend_all_trips_pct_change
    table_ids:
      - share_of_all_trips_table
    population: All yellow taxi and app-based for-hire trips in the daily table, on each kind of day, with the trips that started or ended in the zone as the part (crz_trip v1, proposed and not approved).
    comparison:
      kind: baseline_period
      description: The zone's share of all yellow and high-volume for-hire trips on weekdays and on weekend days in January 2025 against January 2024
      pre_registered: false
    window:
      start: 2025-01-01
      end: 2025-01-31
      timezone: America/New_York
    exclusions:
      - Trips with an unknown zone stay in all trips and never count as into the zone.
    limitations:
      - All trips means yellow taxi plus app-based for-hire only, and most of them are app-based.
      - A falling share is not a fall in trips across the city.
      - The share was not part of the test written in advance.
    recheck:
      mode: not_automatically_evaluable
      reason: Later months are not in the Instance.
      owner: Patrick Morris
  - id: c4
    type: descriptive
    numeric: true
    sentence: "The two services did not move together: yellow taxi trips into the zone per day changed by {{derived:yellow_weekday_pct_change}} on weekdays and {{derived:yellow_weekend_pct_change}} on weekend days, and app-based for-hire trips by {{derived:hvfhs_weekday_pct_change}} and {{derived:hvfhs_weekend_pct_change}}."
    evidence:
      - derived:yellow_weekday_pct_change
      - derived:yellow_weekend_pct_change
      - derived:hvfhs_weekday_pct_change
      - derived:hvfhs_weekend_pct_change
      - ref:crz_by_day_type_service.baseline_weekday_yellow.crz_trips_per_day
      - ref:crz_by_day_type_service.after_weekday_yellow.crz_trips_per_day
      - ref:crz_by_day_type_service.baseline_weekend_yellow.crz_trips_per_day
      - ref:crz_by_day_type_service.after_weekend_yellow.crz_trips_per_day
      - ref:crz_by_day_type_service.baseline_weekday_hvfhs.crz_trips_per_day
      - ref:crz_by_day_type_service.after_weekday_hvfhs.crz_trips_per_day
      - ref:crz_by_day_type_service.baseline_weekend_hvfhs.crz_trips_per_day
      - ref:crz_by_day_type_service.after_weekend_hvfhs.crz_trips_per_day
    table_ids:
      - trips_per_day_by_service_table
    population: The same trips into the zone, yellow taxi and app-based for-hire apart, on each kind of day (crz_trip v1, proposed and not approved).
    comparison:
      kind: baseline_period
      description: Each service on each day type in January 2025 against itself in January 2024
      pre_registered: false
    window:
      start: 2025-01-01
      end: 2025-01-31
      timezone: America/New_York
    exclusions: []
    limitations:
      - App-based for-hire here means high-volume services only; black car, livery and limousine trips are not included.
      - The app-based for-hire source files were read without a file hash.
      - The split by service was not part of the test written in advance, and an earlier run had already shown each service's monthly direction.
    recheck:
      mode: not_automatically_evaluable
      reason: Later months are not in the Instance.
      owner: Patrick Morris
  - id: c5
    type: descriptive
    numeric: true
    sentence: "The two months were not alike on weather: only {{derived:comparable_pairs_all}} matched pairs of days had comparable weather and {{derived:not_comparable_pairs_all}} did not, and {{literal:January 2025}} was colder and much drier."
    evidence:
      - derived:comparable_pairs_all
      - derived:not_comparable_pairs_all
      - ref:weather_matched_pairs.weekday.holiday_pairs
      - ref:weather_matched_pairs.weekday.matched_pairs
      - ref:weather_matched_pairs.weekend.matched_pairs
      - ref:weather_by_period.baseline.mean_tmax_c
      - ref:weather_by_period.after.mean_tmax_c
      - ref:weather_by_period.baseline.wet_days
      - ref:weather_by_period.after.wet_days
      - ref:weather_by_period.baseline.total_snow_mm
      - ref:weather_by_period.after.total_snow_mm
    table_ids:
      - weather_by_month_table
      - matched_pair_days_table
    population: Pairs of days matched on the day of the week, with a maximum temperature and a rain or snow reading at the Central Park weather station, leaving out pairs with a public holiday on either side.
    comparison:
      kind: baseline_period
      description: Each day of 1 to 29 January 2025 against the same day of the week in 3 to 31 January 2024 at Central Park
      pre_registered: false
    window:
      start: 2025-01-01
      end: 2025-01-31
      timezone: America/New_York
    exclusions:
      - Pairs with a public holiday on either side.
    limitations:
      - comparable_weather_day v1 is a proposed rule and does not look at snow.
      - A weather match would not make the comparison a measure of the charge, and a mismatch does not explain the difference.
      - An earlier run paired the same dates rather than the same days of the week, and counted differently.
    recheck:
      mode: not_automatically_evaluable
      reason: A description of two fixed months does not change with new data.
      owner: Patrick Morris
