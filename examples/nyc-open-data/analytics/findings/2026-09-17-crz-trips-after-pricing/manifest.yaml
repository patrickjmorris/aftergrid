  data_to: 2025-02-28
  description: "The retained daily table crz_daily holds yellow taxi and high-volume for-hire trips for January 2024, December 2024, January 2025 and February 2025, and the retained weather table holds Central Park readings for January 2024 and from December 2024 to 2025-02-05. This Finding reads only January 2024 and January 2025 from both. It leaves out green taxis, other for-hire vehicles, private cars, buses, the subway and bikes, every month between February and November 2024, and anything after January 2025. What was retained is the derived daily table, not the TLC trip files."
