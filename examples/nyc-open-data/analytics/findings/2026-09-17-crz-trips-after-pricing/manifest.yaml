owner:
  name: Patrick Morris
  contact: patrickjohnmorris@gmail.com
reader:
  profile: city_transport_analyst
question:
  id: crz_trips_after_pricing
  raw_ask: Did trips into the Congestion Relief Zone change after congestion pricing started, compared with the same period a year earlier?
  state: resolved
  decision: What the transport programme lead reports upward about how trips into the Congestion Relief Zone in January 2025 compare with January 2024, how firmly to say it, and whether to wait for a longer period after the charge before drawing a conclusion. Owned by the programme lead this Finding is written for (Reader profile city_transport_analyst).
  metric:
    id: crz_trip
    version: 1
  population: Yellow taxi and high-volume for-hire (app-based, such as Uber and Lyft) trips that started or ended in one of the 38 taxi zones of the Congestion Relief Zone, counted once each on their pickup date. Green taxis, other for-hire vehicles, private cars, buses and the subway are not in the data.
  window:
    start: 2025-01-01
    end: 2025-01-31
    timezone: America/New_York
  primary_comparison: Two comparisons, kept apart. First, average trips into the zone per weekday (Monday to Friday) in January 2025 (the after period, 1 to 31 January inclusive) against January 2024 (the baseline period). Second, the same for weekend days (Saturday and Sunday). For each, the zone's share of all yellow taxi and high-volume for-hire trips on those days is stated beside the count. Public holidays count as weekdays when they fall on one (weekday_share v1, proposed). The Instance records no start date for the charge, so the after period is the calendar month and no date inside it is treated as the start.
  falsifier:
    kind: check
    check_id: falsifier_direction_holds_in_matched_weather_pairs
    expected_outcome: pass
    statement: The Answer names the direction in which average trips into the zone per weekday moved between January 2024 and January 2025, and separately the direction per weekend day. A direction is wrong if it does not hold among days that were alike, that is, among pairs of days matched on the day of the week (3 to 31 January 2024 against 1 to 29 January 2025), leaving out any pair where either day is a public holiday, and keeping only pairs with comparable weather (comparable_weather_day v1, maximum temperature within 5 degrees Celsius and both days dry or both wet). The test is run only if at least 5 such weekday pairs exist, and it tests weekend days only if at least 3 such weekend pairs exist.
