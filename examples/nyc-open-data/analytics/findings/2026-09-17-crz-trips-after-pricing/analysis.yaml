outcome_recommendation:
  outcome: inconclusive
  reason: The falsifier written and pinned before any revision 2 query recorded fail. Over the whole months the average weekday had more trips into the zone in January 2025 and the average weekend day had fewer, but over the 5 matched weekday pairs with no holiday and comparable weather, trips into the zone were lower, so the weekday direction does not hold among days that were alike. The weekend direction could not be tested, with 1 comparable pair where 3 were needed. The data do not support a direction for either day type.
  what_would_be_needed:
    - More months after January 2025, and the same months a year earlier, in the build. Five comparable weekday pairs and one weekend pair are what one January against one January yields; the same Check over several months would have enough alike days to test both directions.
    - A test whose pairs avoid the days straight after a public holiday. Two of the five weekday pairs set 2 and 3 January 2025 against 4 and 5 January 2024. That was seen after the result, so it is a reason to write the next test differently and not a reason to discount this one.
    - An approved holiday list in the Instance, so the holiday dates stop being the analyst's.
    - A recorded start date for the charge in the Instance, if any day inside January 2025 is to be treated as before it.
    - Approval of crz_trip v1 by its owner before any of this headlines a published decision metric.
