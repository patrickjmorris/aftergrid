  - { kind: probe, id: p_no_duckdb_cli, note: revision 1 }
  - { kind: probe, id: p_coverage, note: revision 1 }
  - { kind: probe, id: p_text_typed_inputs, post_hoc: true, note: revision 1 - after its SQL files were written and before any result existed }
  - { kind: probe, id: p_read_results, post_hoc: true, note: revision 1 - its Checks and queries ran between p_coverage and this look and are listed in revision 1's analysis.yaml in git }
  - { kind: probe, id: p_reframe_day_types, post_hoc: true, note: revision 2 opens here - the day-type split was chosen after revision 1's totals were seen }
  - { kind: probe, id: p_catalog_r2, post_hoc: true, note: after revision 1's results and before any revision 2 Check or query was written - followed by the recapture }
