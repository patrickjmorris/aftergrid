  - { kind: probe, id: p_which_pairs_r2, post_hoc: true }
requested_derived:
  - { id: weekday_per_day_pct_change, operation: percent_change, operands: ["ref:crz_by_day_type.after_weekday.crz_trips_per_day", "ref:crz_by_day_type.baseline_weekday.crz_trips_per_day"], unit: percent, display: { kind: percent, decimals: 1 }, description: Change in average trips into the zone per weekday from January 2024 to January 2025 }
  - { id: weekend_per_day_pct_change, operation: percent_change, operands: ["ref:crz_by_day_type.after_weekend.crz_trips_per_day", "ref:crz_by_day_type.baseline_weekend.crz_trips_per_day"], unit: percent, display: { kind: percent, decimals: 1 }, description: Change in average trips into the zone per weekend day }
  - { id: weekday_all_trips_pct_change, operation: percent_change, operands: ["ref:crz_by_day_type.after_weekday.all_trips_per_day", "ref:crz_by_day_type.baseline_weekday.all_trips_per_day"], unit: percent, display: { kind: percent, decimals: 1 }, description: Change in all yellow and high-volume for-hire trips per weekday }
  - { id: weekend_all_trips_pct_change, operation: percent_change, operands: ["ref:crz_by_day_type.after_weekend.all_trips_per_day", "ref:crz_by_day_type.baseline_weekend.all_trips_per_day"], unit: percent, display: { kind: percent, decimals: 1 }, description: Change in all yellow and high-volume for-hire trips per weekend day }
  - { id: weekday_share_change, operation: difference, operands: ["ref:crz_by_day_type.after_weekday.crz_share", "ref:crz_by_day_type.baseline_weekday.crz_share"], unit: ratio, display: { kind: percentage_points, decimals: 1 }, description: Change in the zone's share of all trips on weekdays }
  - { id: weekend_share_change, operation: difference, operands: ["ref:crz_by_day_type.after_weekend.crz_share", "ref:crz_by_day_type.baseline_weekend.crz_share"], unit: ratio, display: { kind: percentage_points, decimals: 1 }, description: Change in the zone's share of all trips on weekend days }
  - { id: matched_weekday_pct_change, operation: percent_change, operands: ["ref:weather_matched_pairs.weekday.after_crz_trips", "ref:weather_matched_pairs.weekday.base_crz_trips"], unit: percent, display: { kind: percent, decimals: 1 }, description: Change in trips into the zone over the comparable non-holiday matched weekday pairs }
  - { id: yellow_weekday_pct_change, operation: percent_change, operands: ["ref:crz_by_day_type_service.after_weekday_yellow.crz_trips_per_day", "ref:crz_by_day_type_service.baseline_weekday_yellow.crz_trips_per_day"], unit: percent, display: { kind: percent, decimals: 1 } }
  - { id: yellow_weekend_pct_change, operation: percent_change, operands: ["ref:crz_by_day_type_service.after_weekend_yellow.crz_trips_per_day", "ref:crz_by_day_type_service.baseline_weekend_yellow.crz_trips_per_day"], unit: percent, display: { kind: percent, decimals: 1 } }
  - { id: hvfhs_weekday_pct_change, operation: percent_change, operands: ["ref:crz_by_day_type_service.after_weekday_hvfhs.crz_trips_per_day", "ref:crz_by_day_type_service.baseline_weekday_hvfhs.crz_trips_per_day"], unit: percent, display: { kind: percent, decimals: 1 } }
  - { id: hvfhs_weekend_pct_change, operation: percent_change, operands: ["ref:crz_by_day_type_service.after_weekend_hvfhs.crz_trips_per_day", "ref:crz_by_day_type_service.baseline_weekend_hvfhs.crz_trips_per_day"], unit: percent, display: { kind: percent, decimals: 1 } }
  - { id: comparable_pairs_all, operation: sum, operands: ["ref:weather_matched_pairs.weekday.comparable_pairs", "ref:weather_matched_pairs.weekend.comparable_pairs"], unit: days, display: { kind: integer }, description: Matched non-holiday pairs with comparable weather over both day types }
  - { id: not_comparable_pairs_all, operation: sum, operands: ["ref:weather_matched_pairs.weekday.not_comparable_pairs", "ref:weather_matched_pairs.weekend.not_comparable_pairs"], unit: days, display: { kind: integer }, description: Matched non-holiday pairs without comparable weather over both day types }
candidate_claims:
  - id: c1
    sentence_draft: This Analysis cannot say which way weekday trips into the zone moved. Over the whole month the average weekday had more trips into the zone in January 2025 than in January 2024, but over the 5 weekday pairs that were alike on day of the week, holidays and weather there were fewer, which is the result the Question said in advance would show the direction wrong.
    type: descriptive
    numeric: true
