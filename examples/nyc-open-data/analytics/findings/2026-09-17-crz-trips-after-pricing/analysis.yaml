schema_version: 0.1.0
stage: analysed
clarified_at: "2026-09-17T17:23:47Z"
reader_profile: city_transport_analyst
assumptions:
  - id: a_operator_answers_from_instance
    statement: The Operator asked that clarification answers be taken from README.md, readers.md and the definitions rather than from an interview, and recorded here. No round of questions was put to a person in revision 1 or in revision 2.
    basis: operator_answer
    settled_by: Operator run context for both /analyze invocations, 2026-09-17
    affects: [decision, metric, population, window, primary_comparison, falsifier]
  - id: a_operator_reframe
    statement: The Operator (Patrick Morris, 2026-09-17) resolved the revision 1 halt by reframing. Weekdays and weekend days are separate questions. The Question now asks how trips into the zone changed on weekdays, and separately on weekend days, between January 2024 and January 2025, with the zone's share of all yellow and high-volume for-hire trips stated for each. The Operator also directed that the revision carry a new falsifier whose result has not been seen, written and pinned before any new query.
    basis: operator_answer
    settled_by: Operator decision in the run context of this /analyze invocation, 2026-09-17
    affects: [primary_comparison, falsifier]
  - id: a_decision_from_reader_profile
    statement: The decision is what the programme lead reports upward about how the charge is going and how firmly, and whether to wait for a longer window. Taken from the decisions list of the city_transport_analyst profile, which is a composite and not a person.
    basis: instance_document
    settled_by: readers.md, city_transport_analyst
    affects: [decision]
  - id: a_metric_is_proposed_crz_trip
    statement: "'Trips into the zone' means crz_trip v1 - a yellow or high-volume for-hire trip whose pickup or dropoff zone is in crz_zones, counted once. The definition is proposed and carries no approval. The Operator, who owns the definition, directed that it be used as written and its status stated. It is pinned with role supporting and may not headline a published decision metric until approved."
    basis: operator_answer
    settled_by: Operator run context; definitions/crz_trip.md
    affects: [metric, population, publication]
  - id: a_day_type_from_weekday_share
    statement: A weekday is a pickup date with isodow of 5 or less (Monday to Friday) and a weekend day is Saturday or Sunday, the rule of weekday_share v1, which is proposed and unapproved and is used as written. Public holidays are not separated, so New Year's Day and Martin Luther King Jr. Day count as weekdays in both months' averages. The definition file changed after revision 1 (it now reads crz_daily) and is pinned in this revision at the content the Instance holds now.
    basis: instance_document
    settled_by: definitions/weekday_share.md
    affects: [primary_comparison, claims]
  - id: a_window_whole_months
    statement: The after period is the whole of January 2025 and the baseline is the whole of January 2024, as half-open pickup-date ranges. The Instance records no start date for the congestion charge, so none is asserted and days inside January 2025 are not split into before and after.
    basis: operator_answer
    settled_by: Operator run context
    affects: [window, primary_comparison]
  - id: a_timezone_is_file_local
    statement: The analytical timezone is America/New_York. pickup_date in crz_daily is already the local New York date the TLC file carries and the build converts nothing, so the SQL applies no timezone conversion, and the parameter is recorded without being used in a date expression.
    basis: instance_document
    settled_by: definitions/crz_trip.md (window), definitions/weekday_share.md
    affects: [window]
  - id: a_no_materiality_threshold
    statement: Nothing in the Instance records how large a change is large enough to act on. The Analysis reports the size of each change and does not label it large or small; the falsifier tests direction only.
    basis: instance_document
    settled_by: readers.md lists the decision but no threshold
    affects: [falsifier, claims]
  - id: a_day_type_directions_already_seen
    statement: The day-type split is not a comparison planned before the data was seen. Revision 1's results showed the average weekday higher and the average weekend day lower in January 2025, the monthly total higher, yellow taxi trips into the zone higher and high-volume for-hire trips into the zone lower, fewer than half of the date-aligned day pairs with comparable weather, and January 2025 colder and drier. The Operator chose the split after seeing that. So registered_before_cuts is false and every Claim resting on the day-type split carries pre_registered false.
    basis: operator_answer
    settled_by: Operator decision; revision 1 analysis.yaml probe p_read_results
    affects: [primary_comparison, claims]
  - id: a_falsifier_result_not_seen
    statement: "What had been seen when the new falsifier was written - revision 1's analysis.yaml and manifest (the directions above, no magnitudes), the first two data rows of inputs/weather_daily.csv (1 and 2 January 2024, read for the column names), and nothing else. results/crz_trips_daily.json, the only saved artifact with trips per day, was not opened in this run, and no trip count for any single day, no weather class for any day-of-week-matched pair and no total over any subset of days had been computed by anyone. The direction of trips among weather-comparable matched pairs was therefore not known."
    basis: catalog_probe
    affects: [falsifier]
  - id: a_falsifier_alignment
    statement: comparable_weather_day v1 aligns two periods of equal length by day offset from each period's first day. Revision 1 aligned 1 to 31 January in both years, which pairs a Monday with a Wednesday. The falsifier instead aligns 3 to 31 January 2024 with 1 to 29 January 2025, 29 pairs, each pair the same day of the week, so every pair is two weekdays or two weekend days. The only other alignment inside both Januaries that keeps the day of the week (1 to 26 January 2024 against 6 to 31 January 2025) has 26 pairs; the one with more pairs was chosen, before any look at either.
    basis: instance_document
    settled_by: definitions/comparable_weather_day.md (window); the calendar
    affects: [falsifier]
  - id: a_falsifier_holiday_pairs
    statement: "A pair with a public holiday on either side is left out of the falsifier, because a holiday against an ordinary day differs for a reason that is not weather. The holidays are written into the SQL as dates - 1 January of both years, 15 January 2024 and 20 January 2025 (Martin Luther King Jr. Day, the third Monday of January). The Instance holds no holiday table; these dates are general knowledge and were not verified against a source in the Instance. The headline averages still count holidays as weekdays, as weekday_share v1 is written."
    basis: unverified
    affects: [falsifier]
  - id: a_falsifier_gates
    statement: The falsifier is not evaluable (not_run) with fewer than 5 comparable non-holiday weekday pairs, and tests weekend days only with at least 3 comparable non-holiday weekend pairs. Both numbers are the analyst's choice, made before any query, with nothing in the Instance to take them from. A direction over fewer day pairs than that was judged too easily flipped by one unusual day to count as a test.
    basis: unverified
    affects: [falsifier]
  - id: a_outcome_rule_fixed_in_advance
    statement: "Fixed before any query - falsifier pass with both day types tested recommends answered; pass with weekend days untested recommends answered with the weekend direction stated as untested in the Claim's limitations and in What would change our mind; fail recommends inconclusive; not_run recommends inconclusive. A required Check failing or any Check erroring is not an outcome. A minimum_data Check failing recommends insufficient_data."
    basis: engine_default
    settled_by: docs/contracts/checks-and-results.md; skills/checked-analysis/SKILL.md step 4
    affects: [falsifier, claims]
pre_registered_comparison:
  statement: Average crz_trip v1 trips per weekday (yellow plus high-volume for-hire, pickup dates Monday to Friday) in 2025-01-01 to 2025-01-31 against 2024-01-01 to 2024-01-31, and separately the same per weekend day, each with the share of all yellow and high-volume for-hire trips on those days that went into the zone. Secondary, fixed at the same time - the same split by service; the monthly totals as context; the weather in each month; and the day-of-week-matched, non-holiday, weather-comparable pairs the falsifier reads, counted and summed by day type. Registered before any revision 2 query existed, but after revision 1's results had shown the direction for each day type and for each service, so it is not registered before cuts.
  registered_before_cuts: false
  registered_at: "2026-09-17T17:23:47Z"
  source: analysis.yaml, written at the clarify stage of revision 2 before any revision 2 Check or query existed
probes:
  - id: p_catalog
    at: "2026-09-17T15:16:30Z"
    kind: exploratory
    question: Which tables and columns exist, and which can be captured under the admission cap?
    observed: Revision 1. aftergrid capture --catalog listed 10 tables. crz_daily has pickup_date, service, in_crz, trips and three sums; weather_daily has tmax_c, prcp_mm, snow_mm. trips_daily is over the cap and not admissible. The Finding already held whole-table extracts of crz_daily, weather_daily, trips_sample and build_provenance, captured at 2026-09-17T15:09:29Z before that run. The same command printed the first four data rows of each CSV, all dated 1 January 2024; no total was computed.
    changed_plan: Plan reads crz_daily and weather_daily only. crz_zones was not captured and is not needed, because in_crz already carries the rule. trips_sample is retained but unused.
  - id: p_no_duckdb_cli
    at: "2026-09-17T15:16:40Z"
    kind: dead_end
    question: Can the retained CSVs be probed with a duckdb command-line client or the Python duckdb module?
    observed: Revision 1. Neither is installed on this machine. Nothing was read.
    changed_plan: Structural probes used the Python standard library csv reader instead. All evidence SQL runs through aftergrid execute.
  - id: p_coverage
    at: "2026-09-17T15:16:51Z"
    kind: exploratory
    question: Are both months whole in crz_daily and weather_daily, and what does build_provenance say was read?
    observed: Revision 1. crz_daily has 124 rows over 31 days for each of 2024-01, 2024-12 and 2025-01, and 112 rows over 28 days for 2025-02, two services, no null or negative trips and no bad zone flag. weather_daily has 31 observed days in each January with no missing maximum temperature, precipitation or snow, one station. The 2025-01 TLC files were last modified 23 April 2025 and the 2024-01 files 21 March 2024; the high-volume for-hire files were streamed and never hashed. Row and day counts only; no trip total was computed.
    changed_plan: Both whole-month windows are available. The Checks were written next, before any analysis query.
  - id: p_text_typed_inputs
    at: "2026-09-17T15:20:25Z"
    kind: dead_end
    question: Do the Checks and queries run as first written against the retained extracts?
    observed: Revision 1. The first aftergrid execute stopped with a binder error, a text column compared with a date, and wrote nothing, so no number was seen. Retained extracts load every column as text. The time here was read when the repair began, straight after the failure; the failing run itself was not separately timed. A second execute stopped on two manifest strings containing a colon, again before writing anything.
    changed_plan: Every Check and query gained one leading block that casts the columns it reads. No condition, threshold, filter or expected outcome in any Check changed.
  - id: p_read_results
    at: "2026-09-17T15:20:54Z"
    kind: exploratory
    question: What did the pinned results and Checks show?
    observed: Revision 1. Four Checks passed. The falsifier recorded fail - the monthly total of trips into the zone rose, average trips per weekday rose, and average trips per weekend day fell. aftergrid check reported check_failed, evidence invalid, and check --mode rerun reproduced all six results exactly. The falsifier was left as written, required and expecting pass.
    changed_plan: Revision 1 recommended inconclusive and halted for a person to look at the failed falsifier. No Check, threshold or requirement was altered after the result was seen.
  - id: p_reframe_day_types
    at: "2026-09-17T17:23:47Z"
    kind: reframe
    question: Revision 1 (run 2 in examples/nyc-open-data/docs/run-log.md) asked for one direction for trips into the zone and its falsifier fired. What is the Question now?
    observed: "Nothing new was read. The Operator looked at run 2's result - monthly total of trips into the zone up, average weekday up, average weekend day down, falsifier_direction_holds_by_day_type recorded fail - and decided that weekdays and weekend days are separate questions. Revision 1 is archived under revisions/1/ (manifest and memo; its queries, Checks, results and inputs are in git at commit 77435a5). This look is post hoc, the day-type split was chosen after run 2's totals were seen, and the time is when the reframed Question was written into the manifest."
    changed_plan: "The Question was - did total trips into the zone in January 2025 differ from January 2024, one direction, wrong if weekdays and weekend days did not both move that way. The Question is now - how did average trips into the zone per weekday change between January 2024 and January 2025, and separately per weekend day, with the zone's share of all yellow and high-volume for-hire trips stated for each. What prompted it is run 2's falsifier result, named above. The old falsifier is not reused, because its result is known; it leaves the manifest and its file stays in checks/ unedited. The new falsifier, falsifier_direction_holds_in_matched_weather_pairs, tests each direction among day-of-week-matched, non-holiday, weather-comparable day pairs, and nothing it reads had been computed when it was written. No /grill-question revisit was run; the Operator's decision supplied the reframed Question. registered_before_cuts is false and the day-type Claims carry pre_registered false."
  - id: p_catalog_r2
    at: "2026-09-17T17:24:53Z"
    kind: exploratory
    question: Revision 2. After today's rebuild of demo.duckdb, do the tables and columns the reframed plan names still exist and can they be captured?
    observed: aftergrid capture --catalog listed the same 10 tables with the same columns. crz_daily 484 scan rows, weather_daily 98, build_provenance 16, all admissible; trips_daily still over the cap. Nothing was written and no value was read. The recapture at 2026-09-17T17:24:57Z, after clarified_at, returned crz_daily and weather_daily with the same content hashes as revision 1's extracts, so the rebuild did not change a byte of either; build_provenance changed, because the rebuild rewrote its fetch times.
    changed_plan: Revision 2 retains crz_daily, weather_daily and build_provenance. trips_sample, which no query ever read, is no longer a Snapshot input; its file from revision 1 is still on disk and is not referenced.
  - id: p_read_results_r2
    at: "2026-09-17T17:31:03Z"
    kind: exploratory
    question: Revision 2. What did the single aftergrid execute at 2026-09-17T17:30:06Z record?
    observed: "All six queries ran and the six other Checks passed. The falsifier recorded fail. Over the whole months the average weekday had more trips into the zone in January 2025 and the average weekend day had fewer, as revision 1 had shown. Of 21 matched weekday pairs 3 are holiday pairs, 13 are not comparable on weather and 5 are comparable, which is exactly the minimum the falsifier needs, and over those 5 pairs trips into the zone were lower in January 2025, the opposite of the whole-month weekday direction. Of 8 matched weekend pairs 1 is comparable, so the weekend direction was not tested. The execute ran once; nothing was rerun, and no Check, threshold, holiday date, pairing or expected outcome was changed after the result. One oddity was checked against the retained CSV and is real, not a join fault - 3 January 2024 and 2 January 2025 both total 208,956 trips into the zone, from different service rows (151,561 plus 57,395, and 148,807 plus 60,149)."
    changed_plan: The recommendation is inconclusive, by the rule fixed in a_outcome_rule_fixed_in_advance. The run continues to the write-up.
  - id: p_which_pairs_r2
    at: "2026-09-17T17:31:03Z"
    kind: exploratory
    question: Revision 2, after the falsifier result was seen. Which 5 weekday pairs were the comparable ones, and do they fall evenly over the month?
    observed: "Read from results/matched_pair_days.json. The 5 pairs are Thursday 4 January 2024 against Thursday 2 January 2025, Friday 5 against Friday 3, Wednesday 17 against Wednesday 15, Thursday 18 against Thursday 16, and Tuesday 30 against Tuesday 28. Three fell and two rose. The two largest falls are the pairs whose January 2025 day is 2 or 3 January, the two days straight after New Year's Day, which fell on a Wednesday in 2025 and on a Monday in 2024, so those two 2025 days sit closer to the holiday than the 2024 days they are set against. The holiday rule written in advance leaves out only pairs with a holiday on one side and does not cover the days after one. This is a look taken after the result; it is recorded as a limitation and a thing to test next, it is not evidence for a Claim, and the falsifier was not changed to exclude those pairs."
    changed_plan: Nothing in the evidence changed. The write-up names the days-after-New-Year difference in What would change our mind as a reason the pairs test could itself be misleading, labelled as seen after the result, and what_would_be_needed asks for a test over more months where no pair sits in a holiday week.
