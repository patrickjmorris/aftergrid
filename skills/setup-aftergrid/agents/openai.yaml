interface:
  display_name: "Set up aftergrid"
  short_description: "Set up the optional aftergrid command-line tool in this repository and report what is still missing"
  default_prompt: "Set up the optional aftergrid command-line tool in this repository: collect the inputs, run `aftergrid setup`, read the report and tell me what is still missing. A warehouse connection is optional — by default my agent runs the SQL and `aftergrid record` writes down what it ran, so ask about a backend only if I want aftergrid to be able to re-run the queries itself."
policy:
  # User-invoked, matching `disable-model-invocation: true` in SKILL.md. Setup writes files and installs a
  # harness hook: a human asks for it.
  allow_implicit_invocation: false
