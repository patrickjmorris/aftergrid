interface:
  display_name: "Revise an answer"
  short_description: "Apply feedback to an analytical answer, and separate presentation edits from changes to calculations and evidence"
  default_prompt: "Use $revise-finding on the answer and feedback I provide; work from the files and tools I already have, and use the aftergrid CLI only if I ask for it."
policy:
  # User-invoked, matching `disable-model-invocation: true` in SKILL.md. A revision can reopen reviewed work and,
  # with the CLI, drop an approval: a human asks for it.
  allow_implicit_invocation: false
