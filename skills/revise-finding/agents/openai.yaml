interface:
  display_name: "Revise a Finding"
  short_description: "Apply Operator feedback to a reviewed Finding, and say what it reopens"
  default_prompt: "Use $revise-finding on the question or artifact I provide; use portable analysis unless I request an Engine Finding."
policy:
  # User-invoked, matching `disable-model-invocation: true` in SKILL.md. Revising a reviewed Finding bumps its
  # revision and drops its approval: a human asks for it.
  allow_implicit_invocation: false
