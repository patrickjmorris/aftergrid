interface:
  display_name: "Write up an answer"
  short_description: "Turn analysis results into an answer-first write-up a specific reader can act on, with claims linked to evidence"
  default_prompt: "Use $write-finding on the results or draft I provide; work from the files and tools I already have, and use the aftergrid CLI only if I ask for it."
policy:
  # Model-invoked, matching `user-invocable: false` in SKILL.md. The writer is a step inside /analyze, reached
  # once the evidence is pinned, and again for the narrative pass after the charts settle; a human asks for
  # the analysis, not for the memo.
  allow_implicit_invocation: true
