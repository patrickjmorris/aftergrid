interface:
  display_name: "Grill a Question"
  short_description: "Interview the Operator until a raw ask is a Question, and write it into a Finding"
  default_prompt: "Use $grill-question on the question or artifact I provide; use portable analysis unless I request an Engine Finding."
policy:
  # User-invoked, matching `disable-model-invocation: true` in SKILL.md. The interview is the Operator's
  # decisions, and the skill creates a Finding directory and proposes definition files: a human asks for it.
  # The same procedure reached mid-task is the model-invoked `/checked-analysis`, which reads the one shared
  # reference file this skill reads — no user-invoked skill calls another.
  allow_implicit_invocation: false
