interface:
  display_name: "Review an analysis"
  short_description: "Challenge an analysis, chart, or memo for calculation errors, unsupported conclusions, question drift, and reader misinterpretation"
  default_prompt: "Use $analysis-review on the analysis or artifact I provide; work from the files and tools I already have, and use the aftergrid CLI only if I ask for it."
policy:
  # Model-invoked, matching `user-invocable: false` in SKILL.md. `/analyze` reaches for this between writing
  # the draft and checking it; it records agent reviews and never an approval.
  allow_implicit_invocation: true
