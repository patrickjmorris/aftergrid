interface:
  display_name: "Review a Finding"
  short_description: "Method, Question and Reader reviewers over a complete Finding, recorded in the manifest"
  default_prompt: "Use $analysis-review on the question or artifact I provide; use portable analysis unless I request an Engine Finding."
policy:
  # Model-invoked, matching `user-invocable: false` in SKILL.md. `/analyze` reaches for this between writing
  # the draft and checking it; it records agent reviews and never an approval.
  allow_implicit_invocation: true
