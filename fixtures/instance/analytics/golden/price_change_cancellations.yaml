# Golden Question with an expected abstention: too little data since the change.
schema_version: 0.1.0
id: price_change_cancellations
raw_ask: Did the price increase on September 8 make more people cancel?
reader: product_owner
planted: [price_change_partial_window, excluded_cohort_subscription]
expected:
  outcome: insufficient_data
  claim_type: descriptive
  definition_ids: []
  tables_read: [subscriptions]
  values:
    - { id: days_elapsed, reference: since_change.post.days_elapsed, value: 7, tolerance: 0, unit: days, population: n/a, window: 2026-09-08..2026-09-14 New York }
    - { id: cancellations, reference: since_change.post.cancellations, value: 67, tolerance: 0, unit: count, population: subscriptions active at the start of 2026-09-08, window: 2026-09-08..2026-09-14 New York, note: "the planted post-change subscription s_000006b5 must not be counted" }
    - { id: minimum_met, reference: since_change.post.minimum_met, value: 0, tolerance: 0, unit: count, population: same, window: same }
  must_state:
    - that this is not evidence the price change is fine, only that it cannot be judged yet
    - the earliest date the day-count minimum is met, and that the cancellation minimum may still be unmet then
  must_not:
    - compare the partial week with earlier weeks
    - recommend keeping or rolling back the price
  reasoning: Seven days and about seventy cancellations exist against a policy minimum of 28 days and 300 cancellations. The honest Finding says so, names the earliest window end, and makes no before/after comparison. The minimum_data Check failing is the business result, not an engine error.
constraints:
  data_to: "2026-09-14"
  required_checks: [invariant, minimum_data]
reference:
  parameters: { tz: America/New_York, change_date: "2026-09-08", data_to: "2026-09-14", min_days: 28, min_cancellations: 300 }
  queries:
    - id: since_change
      row_key: period
      sql: |
        with s as (
          select subscription_id, cast(timezone($tz, started_at::timestamptz) as date) as start_day,
                 case when canceled_at is null or canceled_at = '' then null else cast(timezone($tz, canceled_at::timestamptz) as date) end as cancel_day
          from subscriptions
        ),
        cohort as (select * from s where start_day < $change_date::date and (cancel_day is null or cancel_day >= $change_date::date)),
        x as (select ($data_to::date - $change_date::date + 1) as days_elapsed,
                     count(*) filter (where cancel_day >= $change_date::date and cancel_day <= $data_to::date) as cancellations from cohort)
        select 'post' as period, days_elapsed, cancellations,
               case when days_elapsed >= $min_days::integer and cancellations >= $min_cancellations::integer then 1 else 0 end as minimum_met
        from x
