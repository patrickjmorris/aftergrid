# Golden Question: a randomised experiment; the one case where a causal Claim is expected.
schema_version: 0.1.0
id: onboarding_checklist_retention
raw_ask: Did the onboarding checklist help new users come back?
reader: product_owner
planted: [checklist_experiment]
expected:
  outcome: answered
  claim_type: causal
  definition_ids: [retained_7d]
  tables_read: [users, events]
  values:
    - { id: checklist_rate, reference: retention_by_arm.checklist.retained_7d_rate, value: 0.3478, tolerance: 0.001, unit: ratio, population: users assigned the checklist inside the window, window: signups 2026-06-01..2026-07-12 New York }
    - { id: control_rate, reference: retention_by_arm.control.retained_7d_rate, value: 0.2848, tolerance: 0.001, unit: ratio, population: users assigned the old onboarding inside the window, window: signups 2026-06-01..2026-07-12 New York }
    - { id: min_arm, reference: retention_by_arm.checklist.signups, value: 624, tolerance: 0, unit: users, population: "the smaller arm: checklist with 624 signups, against the control arm's 653", window: same, note: "the falsifier and the Recheck both require at least 500 users in each arm, so the smaller arm decides whether they are evaluable; a signup count is exact, so the tolerance is 0" }
  must_state:
    - who is counted (signups in the window, both arms) and what the rate is a share of
    - that the comparison is fair because assignment was random
    - that the 3 pp bar was agreed before the experiment and is a decision rule, not a guaranteed effect size
  must_not:
    - present the platform split as a settled fact (it was not pre-registered)
  reasoning: Assignment was randomised by user inside the experiment window, so the difference in retained_7d between arms is attributable to the checklist. The planted effect is on mobile only; the web split is small and exploratory.
constraints:
  window: { start: "2026-06-01", end: "2026-07-12", timezone: America/New_York }
  population: users who signed up inside the experiment window
  required_checks: [invariant, reconciliation, falsifier]
reference:
  parameters: { tz: America/New_York, exp_start: "2026-06-01", exp_end: "2026-07-12" }
  queries:
    - id: retention_by_arm
      row_key: arm
      sql: |
        with cohort as (
          select user_id, onboarding_variant as arm, cast(timezone($tz, signed_up_at::timestamptz) as date) as signup_day
          from users where onboarding_variant in ('checklist', 'control')
        ),
        w as (select * from cohort where signup_day between $exp_start::date and $exp_end::date),
        opens as (select user_id, cast(timezone($tz, "timestamp"::timestamptz) as date) as open_day from events where event = 'app_open'),
        flags as (select c.arm, exists (select 1 from opens o where o.user_id = c.user_id and o.open_day between c.signup_day + 1 and c.signup_day + 7) as r from w c)
        select arm, count(*) as signups, (count(*) filter (where r))::decimal(12,6) / count(*) as retained_7d_rate
        from flags group by arm order by arm
