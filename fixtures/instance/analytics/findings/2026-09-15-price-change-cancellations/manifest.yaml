question:
  id: price_change_cancellations
  raw_ask: Did the price increase on September 8 make more people cancel?
  state: resolved
  decision: Whether to keep the new price, roll it back, or wait.
  metric: { id: weekly_cancellation_rate, version: 1 }
  population: Paid subscriptions that were active when the price changed on 2026-09-08.
  window: { start: "2026-09-08", end: "2026-09-14", timezone: America/New_York, description: Every full day of data since the change. }
  primary_comparison: Daily cancellation rate in the first four weeks after the change, compared with the four weeks before it.
  falsifier:
    kind: check
    check_id: falsifier_cancel_rate
    expected_outcome: pass
    statement: Once four weeks and at least three hundred cancellations have accumulated, the belief that the price change did not raise cancellations is wrong if the daily cancellation rate after the change is more than a fifth higher than before it.
