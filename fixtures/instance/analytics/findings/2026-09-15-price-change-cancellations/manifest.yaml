# Exemplar: a complete insufficient-data Finding on synthetic data. It answers "we cannot tell yet",
# shows what exists, names the earliest date an answer is possible, and does not compare partial data.
# Hashes and the content digest are pinned by scripts/fixture-tool.mjs build.
schema_version: 0.1.0
finding:
  id: fnd_3p8r5t2y7vnc
  revision: 1
  slug: price-change-cancellations
  title: Too early to tell whether the price change made more people cancel
  state: complete
  outcome: insufficient_data
