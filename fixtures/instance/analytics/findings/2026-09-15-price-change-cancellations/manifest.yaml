    on_null: not_available
external_sources:
  - id: minimum_days
    kind: assumption
    value: 28
    unit: days
    display: { kind: integer }
    source: { type: policy, description: "Loop analysis policy: a before/after comparison of cancellations needs at least four full weeks after the change, so that one billing cycle is covered.", date: "2026-03-10", owner: Dana Okafor, location: docs/analysis-policy.md }
  - id: minimum_cancellations
    kind: assumption
    value: 300
    unit: count
    display: { kind: integer }
    source: { type: policy, description: "Loop analysis policy: at least three hundred cancellations in the period, so that a change of a fifth is distinguishable from normal week-to-week noise.", date: "2026-03-10", owner: Dana Okafor, location: docs/analysis-policy.md }
claims:
  - id: c1
    type: descriptive
    numeric: true
    answer_bearing: true
    sentence: "Only {{ref:since_change.post.days_elapsed}} days and {{ref:since_change.post.cancellations}} cancellations have accumulated since the price change; the policy needs {{ext:minimum_days}} days and {{ext:minimum_cancellations}} cancellations before a comparison is made."
    evidence: [ ref:since_change.post.days_elapsed, ref:since_change.post.cancellations, ref:since_change.post.active_at_change, ref:since_change.post.earliest_eligible_date, ext:minimum_days, ext:minimum_cancellations, derived:days_short, derived:cancellations_short ]
    table_ids: [ since_change_table ]
    population: "Paid subscriptions active when the price changed: {{ref:since_change.post.active_at_change}} of them."
    comparison: { kind: target, description: "What has accumulated so far, against the minimum the analysis policy requires. No before/after comparison is made yet.", pre_registered: true }
    window: { start: "2026-09-08", end: "2026-09-14", timezone: America/New_York }
    exclusions:
      - Subscriptions that started after the price change are not part of the population; they never saw the old price.
    limitations:
      - The cancellation count is a raw count, not the weekly cancellation rate, which is still a proposed definition.
    material_caveat: "This is not evidence that the price change is fine. It is evidence that we cannot tell yet. The earliest day we can is {{ref:since_change.post.earliest_eligible_date}}."
    recheck:
      mode: automatic
      predicate: { subject: ref:since_change.post.days_elapsed, operator: lt, threshold: ext:minimum_days, unit: days, direction: none }
      method: restate
      evidence: [ ref:since_change.post.days_elapsed, ref:since_change.post.cancellations ]
      minimum_data: { subject: ref:since_change.post.active_at_change, operator: gte, threshold: 1, unit: count }
      window_policy: advancing_window
      coverage: The subscriptions extract must extend to the new data_to date.
      not_comparable_when:
        - the analysis policy minimums change
  - id: c2
    type: descriptive
    numeric: false
    sentence: The cancellations so far are not compared with the weeks before the change, because the first days after a price change mix people reacting to the announcement with normal cancellations.
    evidence: []
    population: The same subscriptions.
    comparison: { kind: none, description: Deliberately none. A partial first week against full prior weeks would compare unlike things and invite a conclusion the data cannot support., pre_registered: true }
    window: { start: "2026-09-08", end: "2026-09-14", timezone: America/New_York }
    exclusions: []
    limitations:
      - If cancellations spike sharply in the first days, that is visible in the daily count even without a comparison; nothing in the data so far looks like that, but "does not look like" is a judgement, not a measurement.
    recheck:
      mode: not_automatically_evaluable
      reason: This Claim is a methodological choice, not a measurement. Whether to keep withholding the comparison is the Operator's call when the minimum is met.
      owner: Dana Okafor
      review_hint: When the minimum-data Check passes, rerun the analysis with the before/after comparison and retire this Claim.
charts: []
