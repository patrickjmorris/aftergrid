# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: falsifier-required
layer: engine_category
expect: error
category: check_shape
location_pattern: ^checks/falsifier_lift$
defect: "The falsifier Check is declared `required: true`, as though it were an evidence-validity condition."
description: A falsifier decides the Finding's outcome and never its evidence validity. Declaring one required makes a failing falsifier look like a broken execution, which is the mistake that stops an honest inconclusive Finding from existing.
render:
  refused: true
