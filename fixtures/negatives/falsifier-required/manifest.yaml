    comparison:
      kind: variant_vs_control
      description: Users assigned the checklist compared with users assigned the old onboarding, assigned at random when they signed up.
      pre_registered: true
    window:
      start: 2026-06-01
      end: 2026-07-12
      timezone: America/New_York
    exclusions:
      - Users who signed up before 2026-06-01 or after 2026-07-12 were not part of the experiment and are not counted.
    limitations:
      - '"Came back" means opened the app on any of the next seven days; it says nothing about what they did in the app.'
      - Six weeks of signups in early summer; a different season could behave differently.
    material_caveat: "This is a fair comparison only because the two groups were assigned at random. If the checklist had gone to a particular kind of user (for example only iPhone users), the difference could be about those users, not the checklist. And the gap is one experiment's measurement: the {{ext:keep_threshold}} bar is a rule the team agreed in advance for acting on it, not a promise that the gap stays that size."
