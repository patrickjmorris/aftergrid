# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: counter-metric-not-computed
layer: engine_category
expect: pass
category: none
location_pattern: ""
defect: None. The counter-metric could not be computed, and the Finding says so and says why.
description: "The second positive control. A stated reason is a fact a method reviewer reads and can reject; what the Engine refuses is silence. No Check can tell an honest reason from a lazy one, which is exactly why the reason is a sentence in the manifest rather than a boolean: the reason recorded here is the method reviewer's to accept or refuse, and check neither corroborates it nor disputes it. It is one a reader of this directory can check, which is the point of writing it down — every retained_7d cell here belongs to one experiment arm, and no result carries the rate for the whole signup cohort."
render:
  must_contain:
    - "<strong>Counter-metric</strong> retained_7d — not computed:"
    - no result in it carries the rate for the signup cohort as a whole
