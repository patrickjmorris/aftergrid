# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: private-marker-in-memo
layer: engine_category
expect: error
category: export_policy
location_pattern: ^memo\.md:\d+:\d+$
defect: The Instance's private marker is typed into the memo prose.
description: The memo is Reader-facing prose in full, so a private marker in it would be exported. check reports it with a line and column, and render is refused before anything is written — the marker is not left to be caught by the output-byte check alone.
render:
  refused: true
