# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: falsifier-failed-but-answered
layer: analytical_outcome
expect: error
category: analytical_outcome
location_pattern: ^checks/falsifier_lift$
defect: The pre-registered falsifier recorded fail and the Finding is still recorded as answered.
description: A falsifier that fired forces the outcome to inconclusive or needs_reframing. The Answer standing over its own contradicted falsifier is the one thing the falsifier exists to stop.
also_warnings:
  - falsifier_failed
render:
  refused: true
