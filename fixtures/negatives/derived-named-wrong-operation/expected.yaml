# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: derived-named-wrong-operation
layer: engine_category
expect: error
category: derived_arity
location_pattern: ^manifest\.yaml#/derived/\d+$
defect: A sum declares named operands { after, baseline }.
description: Named operands are defined for difference, ratio and percent_change, the three operations whose value has a direction. On sum, min, max or percent_of they declare a direction the operation does not have, and are refused.
