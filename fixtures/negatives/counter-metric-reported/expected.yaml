# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: counter-metric-reported
layer: engine_category
expect: pass
category: none
location_pattern: ""
defect: None. The decision metric names a counter-metric and the Finding reports it, traced, over the Question's own window.
description: The positive control for counter_metric_missing. The reported value resolves through the same strict resolver render uses, its window equals question.window field for field, and the execution behind it pins the counter-metric's definition — which is what ties the number to that definition's population and denominator rather than to a nearby column.
render:
  must_contain:
    - "<strong>Counter-metric</strong> retained_7d:"
    - habits nobody comes back for
    - over 2026-06-01 to 2026-07-12 (America/New_York)
