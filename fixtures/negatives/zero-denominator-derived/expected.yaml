# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: zero-denominator-derived
layer: engine_category
expect: pass
category: none
location_pattern: ""
defect: None. The web control arm has no signups, so a derived ratio divides by zero and a rate cell is null.
description: A zero denominator resolves to "not available" and is rendered with those words; it is never 0, blank or a dash.
render:
  must_contain:
    - the share of that group who came back is <span class="ref"
    - ">not available<"
    - </span> on the web
  must_not_contain:
    - PRIVATE_FIXTURE_MARKER_DO_NOT_RENDER
