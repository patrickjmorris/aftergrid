# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: control-non-answer
layer: analytical_outcome
expect: pass
category: none
location_pattern: ""
defect: None. A complete Finding whose honest outcome is a non-answer (insufficient_data), with a minimum-data Check recorded as fail.
description: "A non-answer is an analytical outcome, not an engine failure: check must report no error and evidence valid even though a Check recorded fail."
also_warnings:
  - direction_unstated
render:
  must_contain:
    - We cannot tell yet
    - this failure is the result of the Finding, not an error
