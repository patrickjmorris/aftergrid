# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: decision-metric-approval-forged
layer: engine_category
expect: error
category: untrusted_attestation
location_pattern: ^manifest\.yaml#/definitions/0/approval$
defect: "The Finding's manifest states an approval for its decision metric that the definition file does not record: a different approver and a different review."
description: An approval is granted on the definition and lives in the definition file; a Finding may only restate it. A well-formed approval block pasted into a manifest is the Finding approving itself, so the restatement must match the file or the decision metric counts as unapproved.
also:
  - definition_not_approved
