# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: derived-cycle
layer: engine_category
expect: error
category: derived_cycle
location_pattern: ^manifest\.yaml#/derived/\d+ \(derived self_reference\)$
defect: A derived value takes itself as an operand.
description: The derived graph must be acyclic; a value that depends on itself has no evidence behind it.
