# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: private-field-sentinel
layer: engine_category
expect: pass
category: none
location_pattern: ""
defect: None. A declared but non-exported column carries the Instance's private marker in every row.
description: "A column outside export_policy.allowed_fields is projected away: neither the marker nor the column name reaches any rendered byte, and check reports no error because the marker never had a path to a Reader."
render:
  must_not_contain:
    - PRIVATE_FIXTURE_MARKER_DO_NOT_RENDER
    - internal_note
