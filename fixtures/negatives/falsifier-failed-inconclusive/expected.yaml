# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: falsifier-failed-inconclusive
layer: analytical_outcome
expect: pass
category: none
location_pattern: ""
defect: "None. The pre-registered falsifier recorded fail, and the Finding records the outcome that follows: inconclusive."
description: "A failing falsifier is an analytical outcome, not an evidence failure: check must report no error, one falsifier_failed warning, and evidence valid, and render must show the falsifier as its own fact on a draft page."
also_warnings:
  - falsifier_failed
render:
  must_contain:
    - <strong>Falsifier</strong>
    - recorded fail; this Finding is inconclusive
    - 7-day retention is not at least 3 percentage points above the control arm
  must_not_contain:
    - PRIVATE_FIXTURE_MARKER_DO_NOT_RENDER
