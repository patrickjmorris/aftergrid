# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: counter-metric-missing
layer: engine_category
expect: error
category: counter_metric_missing
location_pattern: ^manifest\.yaml#/definitions/1$
defect: A complete Finding publishes a decision metric whose definition names a counter-metric, and reports no value for it and no reason it could not be computed.
description: "The Goodhart gap with a Check in front of it. An approved definition that says out loud what pushing it would damage is worth nothing if the Finding that publishes it can leave that out, so the publication path refuses it: report the counter-metric over the same population and window, or record explicitly that it could not be computed, and why."
