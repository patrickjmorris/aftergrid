# What the Engine must report for this case. Generated by src/negatives-build.ts; read by src/negatives.test.ts.
# layer: which kind of fact this is (docs/contracts/golden-questions.md).
# expect: error -> check reports `category` at a location matching location_pattern; pass -> no error;
#         readiness -> no error, but publication readiness is never ready and says why.
case: display-only-rounding
layer: engine_category
expect: pass
category: none
location_pattern: ""
defect: None. The rate column declares whole-percent display while the saved values keep full precision.
description: "Rounding is display only and applied once: the render shows whole percents and the saved decimals never reach the page."
render:
  must_contain:
    - 35%
    - 28%
  must_not_contain:
    - "0.34775641025641024"
    - "0.28483920367534454"
    - 34.8%
