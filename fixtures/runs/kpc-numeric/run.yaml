# What `aftergrid check` and `aftergrid render` reported on output/ when the run was recorded.
verification:
  check_artifact: { syntax: ok, content: complete, evidence: valid, sql_execution: not_performed, readiness: not_ready, errors: 0 }
  check_rerun: { sql_execution: performed, errors: 0, note: every execution and Check reproduced from the retained inputs }
  render: { wrote: [render/finding.html, render/retention_by_arm_chart.svg], label: draft, warnings: 0 }

# No reviewer ran. /analysis-review is a separate skill (bead ag-review-analyze-golden-4ka) and the writer
# never records a review or an attestation, so output/manifest.yaml carries reviews: [] and attestations: [].
reviewer_outcome:
  state: not_exercised
  reason: model-in-the-loop review cannot run in this suite; src/writer.test.ts asserts only the mechanical
    criteria (evidence validity, the writer's field boundary, answer-first structure, bound values, Reader
    vocabulary) that a lint can judge.

provenance:
  derived_from: fixtures/instance/analytics/findings/2026-07-20-onboarding-checklist-retention
  how: The Claim wording, chart, tables and memo prose come from that reviewed exemplar. The input directory
    was produced by removing exactly the fields /write-finding owns; analysis.yaml was then written by hand
    so that following the skill's steps from input/ reaches output/. Digests were re-pinned by the shared
    digestOf, which is what step 8 of the skill instructs.
  deviations_from_the_exemplar:
    - reviews[] and attestations[] emptied, because the writer produces neither.
    - renderer pinned to the shipped renderer (0.1.0) on both sides, so render is a reproduction rather than
      a version-mismatch draft preview.
    - one memo sentence reworded to drop a word on the Reader profile's `avoid` list ("lifts").

# The bead's acceptance criterion asks for the structural and value corrections needed after the first
# `check`. This run cannot report that number, and records the absence rather than a zero.
corrections_after_first_check: not_measured
corrections_not_measured_because: >-
  output/ existed, already reviewed, before input/ did; input/ was produced by deleting the fields
  /write-finding owns. The transformation a corrections counter would score therefore ran backwards -
  nothing was produced and then corrected - so any count here would describe the construction of the
  fixture, not an observation of the skill. Measuring it needs a model in the loop, and this run records
  that none ran.
