  manifest_content_digest: 484da36404f0549e5f6ad9b034d91449076db79b97b0a591eb7e82473e75c782
  analysis_yaml_sha256: b189789c09500e4dfdd732953d77abd5a8d02d7db13a88ce01b2dbe47ce88ca1
