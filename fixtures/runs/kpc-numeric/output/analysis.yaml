# Analysis directory contract (docs/contracts/analysis-directory.md, owned by /checked-analysis).
# Hand-written for this recorded run from the reviewed exemplar
# fixtures/instance/analytics/findings/2026-07-20-onboarding-checklist-retention. No model produced it.
#
# Written against the contract PROSE before src/analysis/analysis.schema.json existed, then mapped onto the
# schema. Nothing recorded here was dropped; two lists moved, because the schema has no field for them:
#   - `requested_external_sources` is now `assumptions`. Each entry keeps its id, kind, value, unit and
#     source note in the assumption's statement, and names itself as `ext:<id>`. The writer declares it in
#     manifest.external_sources with that typed source.
#   - `requested_derived` is now `notes`, one line per value with its id, operation, operands and the Claim
#     that reads it. The writer declares it in manifest.derived with the operation, operands, unit, display
#     and zero-denominator behaviour.
# Neither is listed under `candidate_claims[].evidence`. An evidence reference is resolved against the
# manifest it sits beside, and `derived` / `external_sources` are fields /write-finding owns: in the Analysis
# directory they are still empty, so `derived:`/`ext:` in evidence would be an unresolved reference here and
# this file is byte-identical on both sides. The requests are recorded above and below instead, and the
# recheck predicate and minimum-data lines still name them by id.
# Per-claim `causal_basis` moved into `comparison.description` and `limitations`; `recheck.coverage` moved
# into `recheck_draft.minimum_data`; `probes[].what_it_showed` is now `observed` and `probes[].query_id` is
# now named in `changed_plan` and in the `execution_order` note for that query.
schema_version: 0.1.0
reader_profile: product_owner

assumptions:
  - id: a_random_assignment
    statement: Assignment to the checklist or the old onboarding happened at random when a user signed up, so the two groups differ only in the onboarding they saw. This is what makes c1 causal rather than associational, and it is the only basis v0 accepts for a causal Claim. The arm_balance Check tests the observable consequence (group sizes are close); randomisation itself is a property of the assignment code, not of this data.
    basis: instance_document
    settled_by: Experiment plan for the onboarding checklist, 2026-05-29, at docs/experiments/onboarding-checklist-plan.md
    affects: [c1]
  - id: a_keep_threshold
    statement: "The experiment plan, agreed 2026-05-29 before any data was read, sets the acting threshold at 3 percentage points of 7-day retention. It is a decision rule, not a measurement, so the writer records it as the typed external source ext:keep_threshold, kind target, value 0.03, unit ratio, source note: experiment plan for the onboarding checklist, 2026-05-29, owner Dana Okafor, at docs/experiments/onboarding-checklist-plan.md."
    basis: instance_document
    settled_by: docs/experiments/onboarding-checklist-plan.md
    affects: [c1]
  - id: a_timezone_and_bounds
    statement: The analytical timezone is America/New_York. Every date grouping converts explicitly, and the retained extracts are bounded one day either side of the window so no row is dropped by the conversion.
    basis: engine_default
    settled_by: capture bound chosen by the Analysis, recorded in snapshot.inputs[].description
    affects: [c1, c2]
  - id: a_observation_window_closed
    statement: The last cohort in the window had its full seven days by 2026-07-19, so no user is counted as not returning only because the observation period had not closed.
    basis: catalog_probe
    settled_by: the retained events extract runs to 2026-07-19 and the last signup in the window is 2026-07-12
    affects: [c1, c2]

pre_registered_comparison:
  statement: 7-day retention of users assigned the checklist versus users assigned the old onboarding, over the whole experiment window 2026-06-01 to 2026-07-12 (America/New_York).
  registered_before_cuts: true
  source: question.primary_comparison in manifest.yaml, set by the experiment plan agreed 2026-05-29 before any data was read

# Both probes are looks taken at retained queries, and neither is evidence for a Claim. They are declared
# here and deliberately left out of execution_order: both were taken after the primary comparison had run,
# and execution_order is grouped probe -> check -> query, so recording them first would misstate the order.
# The queries they informed are in execution_order below, with the probe named in the note.
probes:
  - id: p1
    kind: exploratory
    question: Is the difference an artefact of one or two signup weeks?
    observed: The checklist group is ahead in every signup week; the gap moves week to week but never reverses.
    changed_plan: Kept as stability evidence for the primary comparison, not promoted to a Claim of its own. The retention_by_week_arm query was retained.
  - id: p2
    kind: exploratory
    question: Does the difference look the same on mobile and on the web?
    observed: The gap is large on mobile and near zero on the web, with small web groups.
    changed_plan: Decided after seeing the overall result, so the retention_by_platform_arm query is recorded exploratory and its Claim c2 carries pre_registered false. It is a lead, never a pre-registered comparison.

# Checks were written before the final analysis queries and run in this order.
execution_order:
  - kind: check
    id: unique_users
  - kind: check
    id: arm_balance
  - kind: check
    id: retained_7d_reconcile
  - kind: check
    id: falsifier_lift
  - kind: query
    id: retention_by_arm
    note: The pre-registered primary comparison.
  - kind: query
    id: retention_by_week_arm
    note: Stability of the primary comparison across signup weeks; the query probe p1 asked for.
  - kind: query
    id: retention_by_platform_arm
    exploratory: true
    note: The query probe p2 asked for, decided after seeing the overall result. Its Claim carries pre_registered false.

candidate_claims:
  - id: c1
    sentence_draft: 7-day retention is higher in the checklist arm than in the control arm, and the gap
      clears the pre-registered 3 percentage point threshold.
    type: causal
    causal_basis: randomised_assignment
    numeric: true
    answer_bearing: true
    evidence:
      - ref:retention_by_arm.checklist.retained_7d_rate
      - ref:retention_by_arm.control.retained_7d_rate
      - ref:retention_by_arm.checklist.signups
      - ref:retention_by_arm.control.signups
    comparison:
      kind: variant_vs_control
      description: Users assigned the checklist compared with users assigned the old onboarding, assigned at
        random when they signed up. Randomised assignment at signup is the causal basis, and the only one v0
        accepts.
      pre_registered: true
    population: Every user who signed up between 2026-06-01 and 2026-07-12 (America/New_York) and was
      randomly assigned to one of the two onboardings.
    window: { start: "2026-06-01", end: "2026-07-12", timezone: America/New_York }
    exclusions:
      - Users who signed up outside the window were not part of the experiment.
    limitations:
      - Returning means opening the app on any of the next seven days; it says nothing about what the user
        did in the app.
      - Six weeks of early-summer signups; another season could behave differently.
    material_caveat: The comparison is fair only because assignment was randomised at signup, and the
      arm_balance Check tests the observable consequence of that rather than the assignment code itself. The
      3 percentage point bar is a rule agreed before the experiment for acting on the result, not a promise
      that the gap stays that size.
    recheck_draft:
      mode: automatic
      predicate: The lift (derived:lift, the checklist 7-day retention rate minus the control rate) is at or
        above the agreed threshold ext:keep_threshold, in ratio units, higher is better.
      method: difference_in_proportions
      evidence:
        - ref:retention_by_arm.checklist.retained_7d_rate
        - ref:retention_by_arm.control.retained_7d_rate
      minimum_data: "The smaller arm (derived:min_arm_signups) holds at least 500 users. Coverage: both arms
        present for the whole window, retained_7d v2 unchanged."
      window_policy: fixed_window
      not_comparable_when:
        - retained_7d definition version changes
        - assignment stops being random (for example a full rollout), so no control arm exists

  - id: c2
    sentence_draft: Within the platform split, the gap is large on mobile and near zero on the web.
    type: associational
    numeric: true
    evidence:
      - ref:retention_by_platform_arm.mobile_checklist.retained_7d_rate
      - ref:retention_by_platform_arm.mobile_control.retained_7d_rate
      - ref:retention_by_platform_arm.web_checklist.retained_7d_rate
      - ref:retention_by_platform_arm.web_control.retained_7d_rate
    comparison:
      kind: variant_vs_control
      description: Checklist versus old onboarding, inside each platform group. This split was not planned
        before the experiment; it is a follow-up look.
      pre_registered: false
    population: The same users, split by whether they signed up on the iPhone or Android app or in a browser.
    window: { start: "2026-06-01", end: "2026-07-12", timezone: America/New_York }
    exclusions: []
    limitations:
      - Decided after seeing the overall result, so it is a lead to test, not a settled fact.
      - The web groups are small, so the web number moves a lot with a handful of users.
      - "There is no causal basis here: the split was chosen after seeing the overall result, and the
        platform groups were not randomised against each other."
    recheck_draft:
      mode: not_automatically_evaluable
      reason: An exploratory split has no pre-registered threshold; whether the platform difference persists
        is a judgement for the next experiment, not a number to re-test.
      owner: Dana Okafor
      review_hint: On Revisit, re-read the platform table and decide whether a platform-specific experiment
        is warranted.

outcome_recommendation:
  outcome: answered
  reason: The pre-registered comparison ran on the full window, every required Check passed, and the
    falsifier Check produced its expected outcome.

needs_input: []

# Derived values the candidate Claims and rechecks name (the `requested_derived` list this file used to
# carry). The writer declares each one in manifest.derived with its operation, operands, unit, display and
# zero-denominator/null behaviour; it is named above as derived:<id>.
notes:
  - "derived:lift — operation difference, of: checklist minus control 7-day retention rate; c1 and its recheck read it."
  - "derived:mobile_lift — operation difference, of: checklist minus control inside the mobile group; c2 reads it."
  - "derived:web_lift — operation difference, of: checklist minus control inside the web group; c2 reads it."
  - "derived:min_arm_signups — operation min, of: the smaller of the two arm sizes; c1's recheck minimum reads it."
  - "derived:total_signups — operation sum, of: both arm sizes; the population sentence reads it."
  - The writer sets finding.outcome from outcome_recommendation and turns each candidate Claim into a Claim.
    It does not change a query, a result, a definition or a Claim's type, comparison, population or window.
