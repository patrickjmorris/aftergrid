# What /grill-question writes into the Finding's manifest.yaml when the Question cannot be fully sharpened.
# State unresolved, the missing part listed, and NO falsifier key: an unresolved Question never carries one.
# Recorded by hand for fixtures/runs/7qg-referral (no model in loop).
reader:
  profile: product_owner
question:
  id: referral_campaign
  raw_ask: Do users who joined through the September referral campaign stick around better than other new users?
  state: unresolved
  decision: Whether to run the referral campaign again next quarter.
  metric: { id: retained_7d, version: 2 }
  population: Users with a referral_signup event dated September 2026 in New York time, compared with users who signed up in the same month without one.
  # The description is quoted: it carries a comma, and an unquoted value in a flow mapping ends at one.
  window:
    start: "2026-09-01"
    end: "2026-09-30"
    timezone: America/New_York
    description: "The campaign ran the whole calendar month; coverage in the Instance stops at 2026-09-14, so the later cohorts have not had seven days."
  primary_comparison: 7-day retention of referred September signups versus non-referred September signups.
  unresolved: [ falsifier ]
